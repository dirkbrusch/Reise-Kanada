<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#a01e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanada 2026">
<title>Ostkanada 2026 – Reise-App</title>
<style>
  :root{
    --maple:#a01e1e; --maple-dk:#7c1414; --cream:#faf6ef; --ink:#23201d; --muted:#6f6757;
    --card:#ffffff; --line:#e7e0d4; --gold:#c8932a; --green:#2f6b4f; --blue:#1a73e8;
    --soft:#f2ece1; --soft2:#fffdf8; --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);
  }
  body[data-theme="dark"]{
    --cream:#161311; --ink:#efe9df; --muted:#a99e8d; --card:#221e1a; --line:#3a342c;
    --soft:#2b2620; --soft2:#262119; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
  header{position:relative;overflow:hidden;z-index:20;background:linear-gradient(135deg,var(--maple),var(--maple-dk));
    color:#fff;padding:14px 16px;box-shadow:var(--shadow)}
  header .headerbg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  header::after{content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(110deg,rgba(124,20,20,.95) 0%,rgba(124,20,20,.62) 40%,rgba(38,70,100,.40) 100%)}
  header .row,header .count,header .progress,header .progress-txt{position:relative;z-index:1}
  header .row{display:flex;align-items:flex-start;gap:8px}
  header .t{font-size:18px;font-weight:700;letter-spacing:.2px;flex:1}
  header .s{font-size:12.5px;opacity:.9;margin-top:2px}
  .iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;width:34px;height:34px;
    font-size:16px;cursor:pointer;flex:none}
  .count{margin-top:8px;font-size:12.5px;background:rgba(255,255,255,.14);border-radius:10px;padding:7px 10px;display:inline-block}
  .progress{margin-top:10px;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .progress > i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
  .progress-txt{font-size:11px;opacity:.9;margin-top:4px}
  nav.tabs{position:sticky;top:0;z-index:15;display:flex;background:var(--card);border-bottom:1px solid var(--line);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:0 0 auto;border:0;background:none;padding:12px 13px;font-size:13px;font-weight:600;color:var(--muted);
    border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  nav.tabs button.active{color:var(--maple);border-bottom-color:var(--maple)}
  .wrap{max-width:760px;margin:0 auto;padding:14px 12px 60px}
  .pane{display:none}.pane.show{display:block}
  /* Toolbar / Suche */
  .search{display:flex;gap:8px;margin-bottom:10px}
  .search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;
    background:var(--card);color:var(--ink)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:99px;padding:6px 11px;cursor:pointer}
  .chip.on{background:var(--maple);border-color:var(--maple);color:#fff}
  /* Etappen */
  .stage{margin:0 0 14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .stage > .head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--card)}
  .stage > .head .badge{background:var(--maple);color:#fff;font-size:12px;font-weight:700;border-radius:8px;
    min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
  .stage > .head h2{font-size:15.5px;margin:0}
  .stage > .head .sub{font-size:11.5px;color:var(--muted);font-weight:500;display:block;margin-top:1px}
  .stage > .head .cnt{font-size:11px;color:var(--muted);background:var(--soft);border-radius:8px;padding:3px 8px;flex:none}
  .stage > .head .chev{color:var(--muted);transition:transform .2s;flex:none}
  .stage.collapsed .chev{transform:rotate(-90deg)}
  .stage.collapsed .body{display:none}
  .hotel{font-size:12px;color:var(--green);background:rgba(47,107,79,.09);padding:8px 14px;border-top:1px dashed var(--line)}
  .booking{font-size:12.5px;background:rgba(26,115,232,.08);border:1px solid rgba(26,115,232,.25);border-radius:12px;padding:10px 12px;margin:10px 14px}
  .booking .bk{font-weight:700;color:var(--ink);font-size:13.5px}
  .booking .ad{color:var(--muted);margin-top:1px}
  .booking .mk{margin-top:6px;font-size:12px}
  .booking .mk a,.booking a.bmap{color:var(--blue);text-decoration:none}
  .booking .warn{color:#b5651d;margin-top:6px;font-size:11.5px}
  .flight{display:flex;gap:10px;align-items:center;background:rgba(160,30,30,.06);border:1px solid rgba(160,30,30,.2);border-radius:12px;padding:10px 12px;margin:8px 0}
  .flight .fno{font-weight:800;color:var(--maple);font-size:14px;white-space:nowrap}
  .flight .ftxt{font-size:12.5px}
  .transit{font-size:12.5px;background:rgba(124,92,191,.09);border:1px solid rgba(124,92,191,.25);border-radius:12px;padding:9px 12px;margin:8px 14px}
  .transit a{color:var(--blue);text-decoration:none}
  .parking{font-size:12.5px;background:rgba(47,107,79,.08);border:1px solid rgba(47,107,79,.22);border-radius:12px;padding:9px 12px;margin:8px 14px}
  .shopping{font-size:12.5px;background:rgba(199,62,120,.08);border:1px solid rgba(199,62,120,.28);border-radius:12px;padding:9px 12px;margin:8px 14px}
  .shopping ul{margin:5px 0 0;padding-left:18px}
  .shopping li{margin:2px 0}
  .shopping a{color:var(--blue);text-decoration:none}
  .extras{font-size:12.5px;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:8px 14px}
  .extras .ex-sec{margin-top:9px}
  .extras .ex-sec:first-child{margin-top:0}
  .extras h5{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--maple);margin:0 0 3px;font-weight:800}
  .extras ul{margin:0;padding-left:18px}
  .extras li{margin:2px 0}
  .extras a{color:var(--blue);text-decoration:none}
  /* Tagesroute */
  .dayroute{background:linear-gradient(180deg,var(--soft2),var(--card));border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;padding:11px 13px;margin:10px 0 6px}
  .dayroute .rt-head{font-size:13.5px}
  .dayroute .rt-mode{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:4px}
  .dayroute .rt-lead{font-size:12.5px;color:var(--ink);margin:5px 0 9px;line-height:1.5}
  .rt-list{list-style:none;margin:0;padding:0}
  .rt-list li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13px;line-height:1.45}
  .rt-list li .rt-n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .rt-list li.rt-gem .rt-n{background:var(--gold)}
  .rt-list li.rt-gem b{color:#a5781f}
  .rt-d{color:var(--muted);font-size:12px}
  .rt-btn{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:10px}
  .rt-list li.rt-part{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--maple);padding:9px 0 1px}
  .rt-list li.rt-transfer{color:var(--muted);font-size:12px;gap:5px;padding:3px 0 4px 3px}
  .rt-list li.rt-transfer b{color:var(--ink)}
  /* Integrierter Tagesablauf */
  .pbadge{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:middle;letter-spacing:.3px}
  .pbadge.must{background:var(--maple);color:#fff}
  .pbadge.gem{background:rgba(200,147,42,.2);color:#a8781f}
  body[data-theme="dark"] .pbadge.gem{color:#e0b552}
  .item.isgem{border-left:3px solid var(--gold)}
  .fseg{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--maple);margin:14px 0 3px;padding-top:9px;border-top:1px solid var(--line)}
  .fseg:first-of-type{border-top:0;padding-top:0;margin-top:4px}
  .ftr{color:var(--muted);font-size:12.5px;margin:5px 0 5px 8px;padding:2px 0 2px 8px;border-left:2px dashed var(--line)}
  .ftr b{color:var(--ink)}
  .ftr.fhome{border-left-color:var(--green);background:rgba(47,107,79,.06);border-radius:0 8px 8px 0}
  .dayflow{margin-top:6px}
  .tchip{display:inline-block;font-size:10px;font-weight:800;background:var(--soft);color:var(--ink);padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:middle;white-space:nowrap}
  .fnote{background:rgba(200,147,42,.12);border:1px solid rgba(200,147,42,.3);border-radius:11px;padding:9px 12px;margin:4px 0 8px;font-size:12.5px;line-height:1.55}
  .fnote b{color:var(--maple)}
  /* Fuß-Distanz zwischen Stopps (berechnet aus Koordinaten) */
  .fleg{display:flex;align-items:center;gap:7px;margin:1px 0 1px 22px;font-size:11.5px;color:var(--muted);font-weight:600}
  .fleg::before{content:"";width:2px;height:15px;background:linear-gradient(var(--line),var(--blue));border-radius:2px;flex:none}
  .fleg-t{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
  .fleg-far .fleg-t{background:transparent;border-style:dashed;color:var(--muted);opacity:.9}
  .daydist{display:inline-block;margin-left:8px;background:var(--green);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;vertical-align:middle;letter-spacing:.2px}
  .fwarn{display:flex;gap:7px;align-items:flex-start;background:rgba(181,101,29,.13);border:1px solid rgba(181,101,29,.36);border-radius:11px;padding:8px 11px;margin:4px 0 8px 8px;font-size:12px;line-height:1.5;color:#8a4d16}
  body[data-theme="dark"] .fwarn{color:#e0a468}
  .fwarn b{color:#b5651d}
  .wxbar{display:flex;gap:9px;align-items:flex-start;background:rgba(26,115,232,.09);border:1px solid rgba(26,115,232,.28);border-radius:12px;padding:10px 12px;margin:2px 0 10px;font-size:12.5px;line-height:1.55}
  .wxbar .wxi{font-size:17px;flex:none;line-height:1.2}
  .wxbar b{color:var(--blue)}
  /* Adresse + Einzelnavigation je Punkt */
  .addr{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;-webkit-user-select:text;user-select:text}
  .addr .pin{opacity:.7}
  .pill.nav{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
  /* Restaurant-Staffelung: Preistipp / Insider + Preisniveau */
  .pbadge.value{background:rgba(47,107,79,.14);color:var(--green);border:1px solid rgba(47,107,79,.42)}
  .pbadge.insider{background:rgba(124,92,191,.15);color:#6f4bb3;border:1px solid rgba(124,92,191,.42)}
  body[data-theme="dark"] .pbadge.insider{color:#bfa3f0}
  .pricetag{font-size:11px;color:var(--muted);font-weight:800;margin-left:6px;white-space:nowrap}
  /* Einklappbare Gegend-Notiz je Halbtag */
  .fabout{margin:6px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft2);overflow:hidden}
  .fabout>summary{cursor:pointer;padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--maple);list-style:none;display:flex;align-items:center;gap:6px}
  .fabout>summary::-webkit-details-marker{display:none}
  .fabout>summary::after{content:"aufklappen";margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .fabout[open]>summary::after{content:"zuklappen"}
  .fabout .fabout-x{padding:2px 13px 12px;font-size:12.5px;line-height:1.62;color:var(--ink);white-space:pre-line}
  /* Restaurant-Staffelung als Nav-Block */
  .dine-block{margin:8px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft2);padding:10px 12px}
  .dine-t{font-size:12.5px;color:var(--maple);margin-bottom:6px}
  .dine-row{border-top:1px solid var(--line);padding:9px 0 8px}
  .dine-row:first-of-type{border-top:0;padding-top:2px}
  .dine-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
  .dine-why{font-size:12px;color:var(--muted);margin:3px 0 2px;line-height:1.5}
  .dine-row .addr{margin:2px 0 5px}
  .dine-row .pill.nav{display:inline-flex;margin-top:2px}
  .dine-foot{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);margin-top:7px;padding-top:6px}
  .pbadge.top{background:rgba(160,30,30,.1);color:var(--maple);border:1px solid rgba(160,30,30,.3)}
  .stayh-links a.pricelink{color:#a01e1e;font-weight:600}
  .staysub{font-size:11px;font-weight:800;color:var(--maple);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 3px}
  .fewo-links{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .fewo-links a{font-size:12px;text-decoration:none;border:1px solid rgba(160,30,30,.35);border-radius:9px;padding:6px 11px;color:var(--maple);background:rgba(160,30,30,.06);font-weight:600}
  .tour{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:10px 0;background:var(--soft2)}
  .tourhd{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
  .tourhd .cnt2{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:6px;padding:1px 7px}
  .tourbtns{display:flex;gap:7px;margin:7px 0 4px;flex-wrap:wrap}
  .tbtn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--maple);border-radius:9px;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .tbtn.gpx{color:var(--green)}
  .pill.web{color:var(--green)}
  .drive{font-size:12.5px;color:#8a5a16;background:rgba(200,147,42,.12);padding:9px 14px;border-radius:12px;margin:10px 0;border:1px solid rgba(200,147,42,.3)}
  .day{padding:8px 14px 14px;border-top:1px solid var(--line)}
  .day h3{font-size:13.5px;margin:12px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .day h3 .dt{background:var(--soft);color:var(--ink);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
  .item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .item:last-child{border-bottom:0}
  .item .ico{font-size:17px;width:22px;text-align:center;flex:none;line-height:1.5}
  .item .main{flex:1;min-width:0}
  .item .nm{font-size:14px;font-weight:600}
  .item .nt{font-size:12.5px;color:var(--muted);margin-top:1px}
  .item .acts{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .item.done .nm{text-decoration:line-through;color:var(--muted)}
  .pill{font-size:11px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--maple);
    background:var(--card);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .pill.map{color:var(--blue)}
  .src{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700;letter-spacing:.3px}
  .src.v{background:rgba(47,107,79,.14);color:#3f8f6a} .src.n{background:rgba(52,93,171,.14);color:#6b8fd4} .src.c{background:rgba(169,119,42,.16);color:#bd8c3f}
  .cb{width:20px;height:20px;accent-color:var(--green);flex:none;margin-top:2px;cursor:pointer}
  .star{font-size:18px;cursor:pointer;line-height:1;background:none;border:0;padding:0;color:#c9bdab}
  .star.on{color:var(--gold)}
  .note{width:100%;margin-top:6px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:none;
    font-family:inherit;resize:vertical;background:var(--soft2);color:var(--ink)}
  .note.show{display:block}
  /* Item-Politur + Hintergrund-Info */
  .item{border-radius:10px;padding:10px 8px;transition:background .15s}
  .item:hover{background:var(--soft2)}
  .item .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .nm.hasinfo{cursor:pointer}
  .nm .infochev{color:var(--maple);font-weight:800;font-size:13px;transition:transform .2s;line-height:1}
  .item.openinfo .nm .infochev{transform:rotate(90deg)}
  .acts{gap:7px}
  .pill{padding:4px 10px;transition:background .15s,border-color .15s}
  .pill:hover{background:var(--soft)}
  .pill.infoBtn{color:var(--maple);border-color:rgba(160,30,30,.35);background:rgba(160,30,30,.07);font-weight:600}
  .pill.infoBtn:hover{background:rgba(160,30,30,.13)}
  .infopanel{display:none;margin-top:9px;background:var(--soft2);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--ink);
    animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .item.openinfo .infopanel{display:block}
  .infopanel p{margin:0 0 7px;line-height:1.55}
  .infopanel p:last-child{margin-bottom:0}
  .infopanel .tip{background:rgba(200,147,42,.13);border-radius:9px;padding:7px 10px;font-size:12.5px;margin-top:4px;line-height:1.5}
  .infopanel .ilink{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:12.5px;
    color:var(--blue);text-decoration:none;font-weight:600}
  .infopanel .ilink:hover{text-decoration:underline}
  .ev .ilink{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue);
    text-decoration:none;font-weight:600;margin-top:5px;margin-right:8px}
  .ev .ilink:hover{text-decoration:underline}
  /* Tour-Inhalte (Insider-Block je Tag) */
  .tourx{margin:12px 0 4px;background:linear-gradient(180deg,var(--soft2),var(--card));border:1px solid var(--line);border-radius:14px;padding:12px 13px}
  .tourx .tx-lead{font-size:13px;line-height:1.55;color:var(--ink);font-style:italic;margin-bottom:6px;padding-left:10px;border-left:3px solid var(--gold)}
  .tourx .tx-sec{margin-top:12px}
  .tourx .tx-sec h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--maple);margin:0 0 5px;font-weight:800}
  .tx-item{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
  .tx-item:last-child{border-bottom:0}
  .tx-item .txn{font-weight:700}
  .tx-item .txd{color:var(--muted)}
  .tx-item .txl{white-space:nowrap}
  .tx-item .txl a{text-decoration:none;font-size:13px;margin-left:2px}
  .tourx .tx-night{margin-top:11px;background:rgba(38,70,100,.08);border:1px solid rgba(38,70,100,.18);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.55}
  .tourx .tx-night b{color:var(--maple)}
  /* Schlechtwetter- / Entspannen-Buttons */
  .modes{display:flex;gap:8px;margin:10px 14px 2px;flex-wrap:wrap}
  .modes.modes--flush{margin:10px 0 2px}
  .mode{flex:1;min-width:150px}
  .modebtn{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
  .modebtn.rainbtn{background:rgba(38,70,100,.09);border-color:rgba(38,70,100,.28);color:#2a5673}
  .modebtn.relaxbtn{background:rgba(47,107,79,.09);border-color:rgba(47,107,79,.28);color:#2f6b4f}

    route:{walk:true,mode:'🛬 Ankunftstag · Transfer, Check-in & Abendessen nahe Hotel',
     lead:'Realistischer Ankunftstag: Landung ~16:00, Einreise/Gepäck, Transfer ins Hotel, Check-in und kurzer Einkauf – danach entspannt in Hotelnähe essen. Bewusst kein Abendprogramm; die Altstadt-Highlights kommen ab morgen.'},
    items:[
     I('Check-in Embassy Suites by Hilton','hotel','208 Saint-Antoine Ouest · All-Suite mit Küchenzeile','Embassy Suites by Hilton Montreal 208 Saint-Antoine Ouest','v','',{time:'~17:30',noroute:true,info:{d:'All-Suite-Hotel am Rand von Vieux-Montréal (nah an Chinatown und Palais des congrès). Jede Suite hat eine Küchenzeile – praktisch für Selbstverpflegung – und ein warmes Frühstück ist inklusive.',t:'Bei Hilton-Honors-Status nach Upgrade/Late-Check-out fragen.'}}),
     I('Kurz-Einkauf: IGA Complexe Desjardins','market','Wasser, Frühstück, Kleinigkeiten für die Suite · ~10 Min','IGA Complexe Desjardins Montreal','v','',{time:'~18:15',info:{d:'Großer Supermarkt im Complexe Desjardins, teils trocken über die Untergrundstadt (RÉSO) erreichbar. Ideal, um die Suite mit Wasser, Frühstückssnacks und Kleinigkeiten zu bestücken.',t:'Bei Regen die unterirdische Verbindung nutzen.'}}),
     I('Quartier chinois (Chinatown)','food','schnelle, authentische Nudeln & Dumplings · ~5 Min','Quartier chinois Montréal','v','',{info:{d:'Montréals Chinatown rund um die Fußgängerzone Rue de la Gauchetière mit ihren Torbögen, nur wenige Minuten vom Hotel. Schnelle, ehrliche Nudeln, Dumplings und Bubble Tea – perfekt für einen müden Ankunftsabend.',t:'Für Dumplings z. B. Mai Xiang Yuan; meist ohne Reservierung.'}}),
     I('Le Cartet','food','Bistro & Feinkost, Québecer Produkte · ~7 Min','Le Cartet Montréal','v','https://lecartet.com',{noroute:true,info:{d:'Beliebtes Bistro und Feinkostladen in einem hohen Backsteinraum (106 rue McGill) – bekannt für Brunch, abends aber auch unkomplizierte, gute Küche mit lokalen Produkten.',t:'Abends deutlich ruhiger als zur Brunch-Zeit.'}}),
     I('Bevo Bar + Pizzeria','food','neapolitanische Holzofen-Pizza · ~8 Min','Bevo Bar Pizzeria Montréal','v','',{noroute:true,info:{d:'Lebhafte Pizzeria/Bar in Vieux-Montréal mit neapolitanischer Holzofen-Pizza – locker und unkompliziert für einen entspannten ersten Abend.',t:'Terrasse an der Rue Saint-Vincent bei gutem Wetter.'}})],

   {iso:'2026-08-01',dt:'Sa 01.08.',title:'Hub: Vieux-Montréal & Mile End',
    route:{walk:true,mode:'🚶 zu Fuß + Metro · ganzer Tag',
     lead:'Vormittags der historische Kern der Altstadt zu Fuß (die 💎-Perlen liegen direkt am Weg), mittags per Metro ins kreative Mile End – Bagels, Perlen, Plattenläden, Tap-Room – und dort auch der Abend. Der Vieux-Port selbst (Hafenpromenade, Uhrturm, Marché Bonsecours, Cité Mémoire) ist bewusst dem Sonntagnachmittag vorbehalten. Reihenfolge = Laufreihenfolge; Uhrzeiten sind entspannte Richtwerte.'},
    items:[
     I('Basilique Notre-Dame','sight','~5 Min vom Hotel · morgens am ruhigsten','Basilique Notre-Dame Montréal','v','https://www.basiliquenotredame.ca',{must:true,time:'9:30',info:{d:'Neugotisches Meisterwerk von 1829 mit tiefblau bemaltem Gewölbe, tausenden Blattgold-Sternen und einer der größten Casavant-Orgeln Nordamerikas. Der Innenraum ist bewusst wie ein Sternenhimmel gestaltet – ganz anders als das schlichte Äußere vermuten lässt.',t:'Eintritt kostenpflichtig; die abendliche Licht-Show „AURA" ist ein separates Ticket. Früh kommen, bevor die Reisegruppen eintreffen.'}}),
     I('Olive + Gourmando','bakery','Kult-Bäckerei · Sauerteig, Zimtschnecken · Foodie-Frühstück','Olive et Gourmando Montréal','v','https://www.oliveetgourmando.com',{time:'10:00',info:{d:'Bäckerei-Café in Vieux-Montréal (350 Rue Saint-Paul O.), seit 1997 eine Institution: berühmt für Sauerteigbrote, warme Zimtschnecken und üppige Sandwiches. Vormittags voll mit Locals – genau das richtige „Foodie-Frühstück" statt Hotelbuffet.',t:'Nur tagsüber, Di–Sa; früh dran sein, sonst Schlange.'}}),
     I('Cours Le Royer','sight','stiller Innenhof · ~3 Min','Cours Le Royer Montréal','v','',{gem:true,time:'10:30',info:{d:'Autofreier, begrünter Innenhof zwischen ehemaligen Textil-Lagerhäusern des 19. Jahrhunderts, heute Wohn- und Büro-Lofts. Einer der stillsten Winkel der Altstadt – die meisten Touristen laufen an der Zufahrt vorbei.',t:'Perfekte kurze Pause abseits des Trubels der Rue Saint-Paul.'}}),
     I('Chapelle Notre-Dame-de-Bon-Secours','sight','Turmaufstieg, Hafenblick · ~5 Min','Chapelle Notre-Dame-de-Bon-Secours Montréal','v','https://margueritebourgeoys.org',{gem:true,time:'11:00',info:{d:'Die „Seefahrer-Kapelle" von 1771, gegründet von Marguerite Bourgeoys. Von Matrosen gestiftete hölzerne Votiv-Schiffe hängen unter der Decke; eine schmale Treppe führt hinauf auf den Turm.',t:'Turm & Aussichtsplattform gegen kleinen Eintritt – einer der schönsten Hafenblicke der Altstadt.'}}),
     I('St-Viateur & Fairmount Bagel','bakery','die ewige Bagel-Debatte · warm aus dem Holzofen','St-Viateur Bagel Montréal','v','https://stviateurbagel.com',{must:true,time:'12:45',info:{d:'Die zwei legendären Bagel-Bäckereien des Mile End backen im Holzofen die typischen Montréal-Bagels – dünner, etwas süßer, sesamreicher als New Yorker. St-Viateur (seit 1957) und Fairmount (seit 1919) liegen nur Minuten auseinander.',t:'Beide vergleichen gehört zum Pflichtprogramm; warm essen.'}}),
     I('La Drogheria Fine','food','Gnocchi am Walk-up-Fenster · wenige Dollar','La Drogheria Fine Montréal','v','',{gem:true,time:'13:15',noroute:true,info:{d:'Winziges Walk-up-Fenster auf der Fairmount: hausgemachte Gnocchi mit „salsa della nonna" für wenige Dollar – Kult unter Locals.',t:'Nur zum Mitnehmen; ideal als kleine Zwischenmahlzeit.'}}),
     I('Librairie Drawn & Quarterly','shop','Kult-Indie-Buch- & Comicladen','Drawn and Quarterly Montréal','v','https://drawnandquarterly.com',{gem:true,time:'13:45',noroute:true,info:{d:'Legendärer Indie-Comic- und Buchladen, Herz der Mile-End-Literaturszene, oft mit Lesungen. Schön kuratiert zum Stöbern.',t:'Nebenan der Kinder-Ableger „La Petite Librairie".'}}),
     I('Le Champ des Possibles','nature','wilde Stadtwiese hinter den Gleisen','Champ des Possibles Montréal','v','',{gem:true,time:'14:15',info:{d:'Wilde, von Anwohnern zurückeroberte Stadtwiese hinter den Bahngleisen – Wildblumen, Bienen, Street-Art und kaum ein Tourist. Ein Stück ungezähmtes Montréal mitten im Viertel.',t:'Ruhiger Durchatem-Stopp zwischen den Genuss-Stationen.'}}),
     I('Mile End Läden & Plattenläden','shop','Platten, Boutiquen, Galerien · Saint-Viateur/Bernard','Mile End Montréal','v','',{time:'15:00',noroute:true,info:{d:'Das Kreativviertel schlechthin: unabhängige Platten- und Buchläden, Designboutiquen, Galerien und Cafés entlang Saint-Viateur und Bernard.',t:'Perfekt zum planlosen Bummeln – samstags sind alle Läden offen.'}}),
     I('Café Olimpico','cafe','italienischer Espresso seit 1970 · immer voll','Café Olimpico Montréal','v','https://cafeolimpico.com',{time:'15:45',noroute:true,info:{d:'Italienisches Kaffee-Urgestein im Mile End seit 1970, immer voll mit Einheimischen – ernsthafter Espresso ohne Schnickschnack.',t:'Draußen an der Ecke mit den Locals stehen.'}}),
     I('Kem CoBa','food','artisanale Eisdiele · berühmte Soft-Twist-Sorbets','Kem CoBa Montréal','v','',{time:'16:15',noroute:true,info:{d:'Artisanale Eisdiele mit berühmten „soft-twist"-Sorbets in ausgefallenen Kombinationen – meist Schlange, aber jeden Cent wert.',t:'Nach saisonalen Sorten fragen.'}}),
     I('Dieu du Ciel!','beer','Kult-Brauerei (29 Laurier O.) · Apéro','Dieu du Ciel Montréal','v','https://dieuduciel.com',{time:'17:30',info:{d:'Weltbekannte Brauerei-Gaststätte; Biere wie der Kaffee-Stout „Péché Mortel" haben Kultstatus. Klein, voll und sehr lokal.',t:'Früh kommen für einen Platz; toller Tap-Room-Apéro vor dem Dinner.'}}),
     I('Lawrence','food','Mile-End-Klassiker · Nose-to-tail-Marktküche','Lawrence Restaurant Montréal','c','https://lawrencerestaurant.com',{info:{d:'Mile-End-Klassiker mit Nose-to-tail-Marktküche, hauseigener Charcuterie und ganzen Tieren vom Bauernhof – britisch-mediterran inspiriert.',t:'Reservieren.'}}),
     I('Beau Temps','food','Naturwein-Bar · geteilte Teller','Beau Temps Montréal','c','',{noroute:true,info:{d:'Naturwein-Bar/Restaurant mit geteilten Tellern (Geflügelleber-Mousse, Lamm-Tatar) zu fairen Preisen – locker und stimmungsvoll.',t:'Gut für einen ungezwungenen Abend.'}}),
     I("Larry's",'food','lockeres Bistro der Lawrence-Crew','Larrys Montréal','c','',{noroute:true,info:{d:'Lockeres Mile-End-Bistro der Lawrence-Crew – kreative kleine Teller und hervorragende Naturweine, den ganzen Tag geöffnet.',t:'Auch spontan einen Versuch wert.'}}),
     I("L'Express",'food','klassische Pariser Brasserie (Plateau)','L\'Express Montréal','c','https://restaurantlexpress.com',{noroute:true,info:{d:'Seit 1980 die Pariser-Stil-Brasserie schlechthin auf der Rue Saint-Denis im Plateau: Steak frites, Knochenmark, das Cornichon-Glas gratis auf dem Tisch. Zeitlos und immer voll.',t:'Reservieren; vom Mile End ~10 Min mit Metro/Uber – wenn ihr klassische Brasserie wollt.'}})],

   {iso:'2026-08-02',dt:'So 02.08.',title:'Hub: Mont-Royal & Vieux-Port',
    route:{walk:true,mode:'🚶 zu Fuß · kompakt in Hotelnähe · regentauglich',
     wxi:'🌧️',
     wx:'Ihr habt eine Regenwarnung für heute – deshalb ist dieser Tag bewusst kompakt und wettergeschützt: vormittags drinnen/überdacht (Archäologie-Museum, optional das Spa-Schiff), nachmittags eine kurze Hafenrunde, und den Skyline-Blick holt ihr euch aus dem Riesenrad (geschlossene, klimatisierte Gondeln – fährt auch bei Regen). Kein Ausflug auf den Mont-Royal heute. Bei längeren Schauern lassen sich Pointe-à-Callière und der Marché Bonsecours gut dehnen.',
     lead:'Ein ruhiger, kurzer Tag am Wasser statt Kilometer-Marsch: Vormittags wettergeschützt in Hotelnähe – das Archäologie-Museum Pointe-à-Callière über den Fundamenten der Stadtgründung von 1642 (ideal bei Regen; die Basilika hebt ihr euch für die AURA-Vorstellung morgen auf). Nachmittags eine kompakte Hafenrunde mit dem Riesenrad als Aussichts-Highlight. Alles liegt 5–10 Gehminuten vom Hotel; die Distanzen stehen zwischen den Punkten, und die eigentliche Tour bis zum offenen Nachmittag bleibt klar unter dem gestrigen Pensum (die Gesamt-Gehstrecke steht oben im Kopf). Ab 16:00 ist der Nachmittag bewusst offen.'},
    items:[
     I('Kondiaronk-Belvédère','view','klassischer Skyline-Blick am Chalet du Mont-Royal','Kondiaronk Belvedere Montréal','v','',{must:true,time:'10:00',info:{d:'Die große Aussichtsterrasse am Chalet du Mont-Royal mit dem klassischen Postkartenblick über Downtown und den Strom. Der Berg wurde vom Central-Park-Architekten Frederick Law Olmsted gestaltet.',t:'Morgens bestes Licht und noch leer.'}}),
     I('Mont-Royal Summit Loop & Croix','nature','ruhige Waldpfade zur Croix · ~30–40 Min','Mont Royal summit loop trail','v','',{gem:true,time:'10:45',info:{d:'Ruhige Waldpfade vom Belvédère hinauf zur Croix du Mont-Royal und zu versteckten Aussichten – wenig Touristen, viel Grün. Die beleuchtete Croix ist nachts weithin sichtbar.',t:'Feste Schuhe reichen; Schleife ~30–40 Min.'}}),
     I('Lac aux Castors & Maison Smith','nature','kleiner See mit Pavillon-Café · Rastpunkt','Lac aux Castors Montréal','v','',{time:'11:30',info:{d:'Kleiner See im Bergpark mit Pavillon (Maison Smith) und Skulpturenwiese – ein schöner Rastpunkt mit Café. Im Sommer Tretboote.',t:'Kaffee/Snack im Pavillon Maison Smith – heute ist das euer „Mittagessen light", bevor es an den Hafen geht.'}}),
     I('Tam-Tams du Mont-Royal','sight','sonntags: Trommelkreis am Cartier-Denkmal','Tam-Tams Mont-Royal Montréal','v','https://www.lemontroyal.qc.ca',{must:true,time:'12:15',info:{d:'Sonntäglicher, frei zugänglicher Trommelkreis am Fuß des Bergs rund um das George-Étienne-Cartier-Denkmal, dazu Picknick, Jongleure und ein kleiner Kunsthandwerksmarkt. Eine der lebendigsten Montréaler Traditionen.',t:'Nur sonntags ab ~Mittag bei gutem Wetter – heute kurz mitnehmen, dann geht es an den Hafen.'}}),
     I('Place Jacques-Cartier','sight','lebhafter Pflasterplatz · Straßenkünstler & Terrassen','Place Jacques-Cartier Montréal','v','',{time:'13:00',ll:[45.50786,-73.55329],info:{d:'Der abschüssige Pflasterplatz zwischen Rathaus und Hafen – Straßenkünstler, Blumenstände und Terrassen. Das lebendige Entree zum Vieux-Port.',t:'Sonntagnachmittag ist hier am meisten los; die Terrassen an den Rändern sind ruhiger.'}}),
     I('Marché Bonsecours','shop','Kunsthandwerk-Markthalle · Québecer Designer','Marché Bonsecours Montréal','v','https://marchebonsecours.qc.ca',{time:'13:20',ll:[45.50958,-73.55134],info:{d:'Klassizistischer Markthallenbau von 1847 mit silberner Kuppel – einst Parlament und Rathaus. Heute lokale Boutiquen, Kunsthandwerk und Designer aus Québec statt Souvenir-Kitsch.',t:'Gute Adresse für ehrliche Mitbringsel; sonntags meist bis ~18 Uhr geöffnet (vor Ort prüfen).'}}),
     I('Bassin Bonsecours','nature','Wasserbecken mit Tretbooten · ruhige Ecke','Bassin Bonsecours Montréal','v','',{gem:true,time:'13:45',ll:[45.50847,-73.54983],info:{d:'Ruhiges Hafenbecken zwischen Uhrturm und Marché Bonsecours mit Tretbooten im Sommer und einer der schönsten Perspektiven auf die Altstadt-Silhouette.',t:'Direkt hinter dem Marché Bonsecours – 3 Min zu Fuß, schöner Fotostopp am Wasser.'}}),
     I('Tour de l\'Horloge','view','Aussicht & Stadtstrand · gratis · Wendepunkt','Tour de l\'Horloge Montréal','v','',{gem:true,time:'14:15',ll:[45.50964,-73.54673],info:{d:'1922 als Denkmal für gefallene Matrosen errichteter Uhrturm am Quai de l\'Horloge – das östliche Ende des Vieux-Port. 192 Stufen führen zu einer kostenlosen Aussichtsplattform; davor liegt ein städtischer Sandstrand direkt am Fluss.',t:'Aufstieg gratis, ~20–25 Min mit Aussicht. Danach geht es über die Promenade wieder westwärts zurück.'}}),
     I('Promenade du Vieux-Port','view','Uferweg westwärts zurück · Straßenkünstler','Promenade du Vieux-Port Montréal','v','',{time:'14:45',ll:[45.50499,-73.55237],info:{d:'Die lange Hafenpromenade zwischen Uhrturm und Quai King-Edward: Wasser, Rasenflächen, Straßenkünstler und Eisstände. Der Rückweg vom Uhrturm ist ein entspannter 12-Minuten-Bummel am Strom entlang.',t:'Perfekter Zeitpunkt: nachmittags spielen hier die meisten Straßenkünstler.'}}),
     I('Quai Jacques-Cartier','view','Herz des Hafens · Rasenflächen, Foodtrucks, Hafenblick','Quai Jacques-Cartier Montréal','v','',{time:'15:45',ll:[45.50731,-73.54877],info:{d:'Der zentrale Quai des Alten Hafens, direkt unterhalb der Place Jacques-Cartier: breite Rasenflächen, Foodtrucks, Bänke am Wasser und der beste Blick zurück auf die Altstadt-Silhouette. Im Sommer der lebendigste Platz am Hafen.',t:'Guter Treffpunkt – von hier sind es 5 Min zurück in die Altstadtgassen und ~8 Min zum Hotel.'}}),
     I('Bota Bota','spa','nordisches Spa-Schiff · optional, ideal bei Regen','Bota Bota Montréal','c','https://botabota.ca',{time:'optional',noroute:true,ll:[45.49983,-73.55097],info:{d:'Nordisches Spa auf einer umgebauten Fähre im Alten Hafen: Warm- und Kaltbecken, Saunen und Ruhedecks mit Blick auf den Sankt-Lorenz-Strom. Braucht 2–3 Stunden.',t:'Passt heute zeitlich nicht mehr – aber es liegt nur 5 Min vom Hotel und lässt sich an jedem Montréal-Tag spontan einschieben (vorab reservieren, Badesachen mitnehmen).'}}),
     I('Les Sœurs Grises','beer','Brauerei-Gasthaus · eigene Fassbiere · Apéro','Les Sœurs Grises Montréal','v','',{time:'18:45',ll:[45.49889,-73.55379],info:{d:'Handwerks-Brauerei-Gasthaus in Vieux-Montréal (32 Rue McGill) mit eigenen Bieren direkt vom Fass und geräucherten Spezialitäten. Ein entspannter Tap-Room für einen Apéro, bevor es zum Abendessen geht.',t:'Vom Quai Jacques-Cartier ~8 Min zu Fuß. Bei gutem Wetter Terrasse. Alternativ direkt am Wasser: Terrasse William Gray (Rooftop).'}}),
     I('Garde Manger','food','Seafood ohne Türschild · reservieren','Garde Manger Montréal','c','',{time:'19:30',ll:[45.5028,-73.5556],info:{d:'Chuck Hughes\' berühmtes Seafood-Lokal in Vieux-Montréal – ohne Schild an der Tür, eng, laut und lebendig. Austern, Hummer-Poutine und tagesfrische Meeresfrüchte in echter Bistro-Atmosphäre.',t:'Nur mit Reservierung; sehr klein und immer voll. ~5 Min vom Hafen.'}}),
     I('Modavie','food','Lammküche + Live-Jazz jeden Abend','Modavie Montréal','c','https://www.modavie.com',{noroute:true,ll:[45.50547,-73.55396],info:{d:'Vieux-Montréal-Institution an der Ecke Saint-Paul/Saint-Vincent mit Fokus auf Lammgerichten und Québecer Produkten – dazu Live-Jazz an jedem Abend ohne Aufpreis.',t:'Früh reservieren, um zu den Jazz-Sets gut zu sitzen – auch sonntags Musik.'}}),
     I('Barroco','food','holzgegrillte Küche im Gewölbekeller','Barroco Montréal','c','https://barroco.ca',{noroute:true,ll:[45.50141,-73.55594],info:{d:'Geschichtsträchtige Vieux-Montréal-Adresse in einem Steingewölbe: holzgegrillte Küche, Paella, Wild und kräftige Weine – warm und intim.',t:'Gute Sonntags-Alternative, wenn Garde Manger ausgebucht ist.'}}),
     I('Cité Mémoire','sight','Gratis-Videoprojektionen in den Altstadt-Gassen (Fr–So abends)','Cité Mémoire Montréal','v','https://www.montrealenhistoires.com',{gem:true,noroute:true,info:{d:'Eine der größten Outdoor-Videoprojektionen der Welt: nach Einbruch der Dunkelheit erscheinen Szenen aus Montréals Geschichte an den Hauswänden der Altstadt. Ein stimmungsvoller, kostenloser Abschluss direkt beim Hotel.',t:'Nur Fr–So nach Dunkelheit (im August ab ~21:00) – Sonntag ist der letzte Abend der Woche. Die App „Montréal en Histoires" liefert Ton und Erklärungen.'}}),
     I('Grande Roue de Montréal','view','60-m-Riesenrad · geschlossene Gondeln · euer Skyline-Blick','Grande Roue de Montréal','v','https://lagranderouedemontreal.com',{must:true,time:'15:15',ll:[45.50759,-73.55077],info:{d:'Das 60 m hohe Riesenrad am Quai King-Edward mit klimatisierten, verglasten Gondeln und Rundumblick über Altstadt, Hafen und Strom. Weil die Gondeln geschlossen sind, geht die Fahrt auch bei Regen – heute euer Ersatz für den Aussichtsberg.',t:'Ticket vorab online oft günstiger; ~4 Min vom Quai Jacques-Cartier. Abends beleuchtet besonders schön.'}}),
     I('Basilique Notre-Dame','sight','~4 Min vom Hotel · drinnen · morgens am ruhigsten','Basilique Notre-Dame Montréal','v','https://www.basiliquenotredame.ca',{must:true,time:'10:00',ll:[45.50444,-73.55599],info:{d:'Neugotisches Meisterwerk von 1829 mit tiefblau bemaltem Gewölbe, tausenden Blattgold-Sternen und einer der größten Casavant-Orgeln Nordamerikas – ein Sternenhimmel-Innenraum, ganz anders als das schlichte Äußere. Perfekter, trockener Auftakt an einem Regentag.',t:'Falls ihr sie gestern schon gesehen habt: überspringen und direkt zum Museum. Eintritt kostenpflichtig; die Abend-Show „AURA" ist ein separates Ticket.'}}),
     I('Pointe-à-Callière','sight','Archäologie-Museum am Gründungsort · der Regen-Anker','Pointe-à-Callière Montréal','v','https://pacmusee.qc.ca',{must:true,time:'10:45',ll:[45.5026,-73.55418],info:{d:'Montréals preisgekröntes Archäologie- und Geschichtsmuseum steht genau über den freigelegten Fundamenten der Stadtgründung von 1642. Ein unterirdischer Rundgang führt durch echte Ruinen, den alten Abwasserkanal und eine multimediale Zeitreise – der beste Ort der Stadt bei Regen.',t:'Plant 1–1,5 Std. ein; lässt sich bei Dauerregen gut dehnen. An der Place Royale, ~3 Min von der Basilika.'}})],
    flow:[
     {seg:'☀️ Vormittag · Vieux-Montréal, drinnen & überdacht (ab ~10:00 · alles ~5 Min vom Hotel)'},
     {note:'☔ Bewusst kompakt & wettergeschützt rund ums Hotel (208 Saint-Antoine O.). Kein Mont-Royal heute – bei Regen wäre die Aussicht verhangen und die Tam-Tams fallen aus; den Skyline-Blick holt ihr euch nachmittags aus dem Riesenrad. Und die Basilika lasst ihr heute außen vor – da geht ihr morgen zur AURA-Vorstellung hinein. ☀️ Nur falls es überraschend aufklart: Bus 11 ab Metro Mont-Royal zum Kondiaronk-Belvédère + sonntags die Tam-Tams am Cartier-Denkmal – aber wirklich nur bei trockenem Wetter.'},
     18,10,
     {note:'🥐 Mittag leicht & unterwegs: z. B. eine warme Zimtschnecke bei Olive + Gourmando (Rue Saint-Paul O.) oder ein Café in den Gassen – kein großes Mittagessen, damit der Abend Platz hat.'},
     {seg:'⛵ Nachmittag · Vieux-Port — kurze Hafenrunde & Riesenrad (ab ~13:00)'},
     {note:'🧭 Laufrichtung: von der Place Jacques-Cartier nach Osten bis zum Uhrturm (Wendepunkt), dann über die Promenade westwärts zum Riesenrad und zurück zum Quai Jacques-Cartier. Alles am Wasser, kurze Wege – die Distanz steht jeweils zwischen den Punkten. Den Marché Bonsecours (die alte Markthalle) überspringt ihr – da seid ihr gestern schon durchgelaufen.'},
     4,6,7,8,16,9,
     {seg:'⏳ 16:00 · Offene Zeit am Quai Jacques-Cartier (ca. 2,5 h, bis ~18:30)',endtour:true},
     {note:'⏳ Ab hier bewusst kein Programm: gut zweieinhalb Stunden offen am Vieux-Port. Treiben lassen, den Straßenkünstlern zusehen, am Wasser sitzen. Die Altstadtgassen beginnen gleich oberhalb (~5 Min), zum Hotel sind es ~15 Min – der Apéro liegt danach auf dem Rückweg westwärts (Distanz steht am Punkt).'},
     {seg:'🍺 Apéro · Vieux-Montréal (ab ~18:45) — Tap-Room oder Rooftop'},
     11,
     {seg:'🌆 Abend · Vieux-Montréal — Restaurant zur Auswahl (ab ~19:30)'},
     {note:'🍽️ Drei Adressen zur Wahl (alle fußläufig, unbedingt reservieren): 1) Garde Manger – lebhaftes Seafood ohne Türschild · 2) Modavie – Lammküche mit Live-Jazz · 3) Barroco – holzgegrillte Küche im Gewölbe. ⚠️ Sonntag: Öffnungszeiten vorher prüfen, einige Altstadt-Adressen haben So/Mo Ruhetag.'},
     12,13,14,
     {seg:'🌙 Nach dem Essen · direkt vor der Haustür (ab ~21:00)'},
     15,
     {home:'alles fußläufig: aus der Altstadt oder von den Cité-Mémoire-Projektionen sind es ~5–10 Min zurück zum Embassy Suites (208 Saint-Antoine O.). Bei Regen kurze Wege oder Uber ~8–10 CAD.'}
    ]},

     I('Isle de Garde','beer','Brewpub mit zwei Terrassen','Isle de Garde Montréal','v','https://www.isledegarde.com',{time:'16:00',info:{d:'Brewpub mit zwei Terrassen und Schwerpunkt auf europäischen Bierstilen – entspannt und lokal.',t:'Gute Zwischenstation vor dem Apéro.'}}),

     I('Mon Lapin','food','eines der besten Restaurants Kanadas','Mon Lapin Montréal','c','https://vinmonlapin.com',{info:{d:'Erfinderische québecoise Saisonküche und herausragende Naturweine in intimer Atmosphäre – regelmäßig unter Kanadas besten Restaurants.',t:'Wochen im Voraus reservieren.'}}),
     I('Au Pied de Cochon','food','deftig, legendär · Foie-Gras-Poutine','Au Pied de Cochon Montréal','c','https://www.aupieddecochon.ca',{noroute:true,info:{d:'Martin Picards berüchtigtes Lokal für deftige Foie-gras- und Schweineküche – exzessiv und legendär.',t:'Reservieren; nichts für den kleinen Hunger.'}}),
     I('Caribou Gourmand','food','Bistro de terroir · Wildspezialitäten','Caribou Gourmand Montréal','c','https://www.caribougourmand.com',{noroute:true,info:{d:'Bistro de terroir québécois im Plateau mit Wildspezialitäten (z. B. Yak-Burger) und regionalen Saisonprodukten.',t:'Gute Wahl für Wild/Regionales.'}}),
     I('Rôtisserie La Lune','food','Québecer Brathähnchen vom Mon-Lapin-Team','Rôtisserie La Lune Montréal','c','https://www.rotisserielalune.com',{noroute:true,info:{d:'Québecer Brathähnchen-Rôtisserie vom Mon-Lapin-Team – traditionsverbunden und kreativ zugleich.',t:'Lockerer als Mon Lapin, oft leichter zu bekommen.'}}),
     I('Basilique Notre-Dame · AURA','sight','✨ AURA-Lichtvorstellung · Tickets 17:30','Basilique Notre-Dame Montréal','v','https://www.basiliquenotredame.ca',{must:true,time:'17:30',ll:[45.50444,-73.55599],info:{d:'Die neugotische Basilika von 1829 – tiefblaues Sternenhimmel-Gewölbe, Blattgold und riesige Casavant-Orgel – wird für AURA von Moment Factory in ein immersives Licht- und Klangerlebnis verwandelt: Projektionen an Wänden und Säulen, Orchestermusik und ein leuchtender Abschluss im Chor. Dauer ~45 Min.',t:'Tickets sind gebucht (17:30). Rechtzeitig da sein für gute Plätze – so seht ihr den Innenraum gleich in voller Inszenierung.'}}),
     I('Modavie','food','Lammküche + Live-Jazz · Top-Wahl','Modavie Montréal','v','https://www.modavie.com',{time:'18:45',noroute:true,ll:[45.50547,-73.55396],addr:'1 Rue Saint-Paul Ouest, Vieux-Montréal',price:'€€€',info:{d:'Vieux-Montréal-Institution an der Ecke Saint-Paul/Saint-Vincent mit Fokus auf Lamm und Québecer Produkten – dazu Live-Jazz an jedem Abend ohne Aufpreis. ~4 Min von der Basilika.',t:'Reservieren; früh da sein für die Jazz-Sets.'}}),
     I('Stash Café','food','osteuropäisch-herzhaft · günstige Altstadt-Institution','Stash Café Montréal','v','',{tier:'value',noroute:true,ll:[45.50264,-73.55522],addr:'200 Rue Saint-Paul Ouest, Vieux-Montréal',price:'€€',info:{d:'Gemütliches polnisches Lokal in Vieux-Montréal (seit 1974): Pierogi, Bigos, Wildgulasch bei Kerzenlicht an schweren Holztischen – bodenständig und deutlich günstiger als die Gourmet-Adressen ringsum, abends oft mit Klavier.',t:'Ehrlich: keine québecoise Küche – aber die günstigste echte Altstadt-Institution. Lokale Küche ist im teuren Vieux-Montréal abends rar; wer québecois will, nimmt Modavie oder geht einen Block weiter (siehe Insider).'}}),
     I('Nouilles de Lan Zhou','food','handgezogene Nudeln · Chinatown-Kult','Nouilles de Lan Zhou Montréal','c','',{tier:'insider',noroute:true,ll:[45.50781,-73.5596],addr:'Boul. Saint-Laurent, Chinatown (~6 Min)',price:'€',info:{d:'Winziges Lokal in Montréals Chinatown (grenzt direkt an die Altstadt): handgezogene Lanzhou-Nudeln in kräftiger Rinderbrühe für wenige Dollar, voll mit Studenten und Einheimischen.',t:'Insider – vor Ort selbst checken (Öffnungszeiten/Andrang). Bar/Karte, oft kurze Schlange. Von der Basilika ~6 Min Richtung Chinatown, dafür günstig und authentisch.'}})],
    flow:[
     {seg:'☀️ Vormittag · Little Italy (ab ~10:00)'},
     {about:{t:'Little Italy & der Jean-Talon-Markt',x:'Little Italy (La Petite-Italie) ist seit den 1910ern das italienische Herz Montréals – rund um den riesigen Jean-Talon-Markt reihen sich Espresso-Bars, Salumerie und Trattorien, in denen oft noch Italienisch gesprochen wird.\n\nWorauf achten:\n• Der Markt ist vormittags am lebendigsten – Käse, Ahornprodukte und Obst zum Durchprobieren und als Mitbringsel.\n• An den Espresso-Bars (San Simeon) im Stehen bestellen wie die Locals; ein Allongé kostet wenige Dollar.\n• In der Kirche Madonna della Difesa nach oben schauen: das umstrittene Deckenfresko, das Mussolini zu Pferd zeigt.\n• Die Seitenstraßen (Rue Dante, Saint-Zotique) haben kleine Feinkostläden abseits der Halle – reinschauen lohnt.'}},
     {tr:'🚇 Metro Orange ab Square-Victoria–OACI (Richtung Montmorency) bis Jean-Talon (~15 Min), dann ~3 Min zu Fuß zum Markt.'},
     0,1,2,3,4,
     {note:'🍴 Mittags Grazing: Kult-Allongé bei Caffè San Simeon, italienische Feinkost in der Quincaillerie Dante, frisch vom Jean-Talon-Markt – kein fester Mittagstisch.'},
     {tr:'🚇 Metro Orange ab Jean-Talon (Richtung Côte-Vertu) bis Mont-Royal, dann ~8 Min zu Fuß in den Plateau (Parc La Fontaine). Alt.: ~25 Min gemütlich zu Fuß südwärts.'},
     {seg:'🌤️ Nachmittag · Plateau (ab ~13:30, gestrafft) — Park & Murals'},
     {about:{t:'Das Plateau Mont-Royal',x:'Das Plateau ist Montréals frankophones Kreativviertel: bunte Reihenhäuser mit den berühmten geschwungenen Außentreppen, Wandbilder, Buchläden und Terrassen – lange die Heimat der Künstler- und Studentenszene.\n\nWorauf achten:\n• Die spiralförmigen Außentreppen (escaliers) sind das Markenzeichen – schön entlang der Rue Saint-Denis und den Nebenstraßen.\n• Die großen Murals stehen v. a. am Boulevard Saint-Laurent (Erbe des MURAL-Festivals); viele stecken in Seitengassen – langsam laufen und schauen.\n• Der Parc La Fontaine ist die grüne Mitte, im Sommer manchmal Open-Air-Kultur am Teich.\n• In den grünen Wohngassen (ruelles vertes) wird gewohnt – leise und respektvoll bleiben.'}},
     {note:'⏱️ Heute bewusst gestrafft: Um 17:30 beginnt AURA in der Basilika – also gegen 16:30 Richtung Metro, damit ihr rechtzeitig da seid. Kein Plateau-Apéro heute (Isle de Garde / Vices & Versa bleiben für einen anderen Tag).'},
     5,6,7,8,
     {tr:'🚇 Rechtzeitig zurück in die Altstadt: Metro Orange ab Mont-Royal (Richtung Côte-Vertu) bis Place-d\'Armes (~12 Min), dann ~2 Min zur Basilika. Puffer einplanen – ihr wollt vor 17:30 dort sein.'},
     {seg:'✨ 17:30 · AURA in der Basilique Notre-Dame (Tickets gebucht)'},

     16,17,18,
     {home:'aus der Altstadt (rund um die Basilika) sind es ~8–10 Min zu Fuß zurück zum Embassy Suites (208 Saint-Antoine O.).'}
    ]},

     {about:{t:'Quartier Petit-Champlain',x:'Die Rue du Petit-Champlain gilt als eine der ältesten Handelsstraßen Nordamerikas, und sie fühlt sich auch so an: ein enges Kopfsteinpflaster-Gässchen, zu Füßen der Steilwand unter dem Château Frontenac, gesäumt von schmalen Häusern aus dem 17. und 18. Jahrhundert mit Blumenkästen, Kunsthandwerk-Boutiquen und Ateliers. Im 19. Jahrhundert war dies ein hart arbeitendes Hafen- und Handwerkerviertel; nach dem Niedergang haben Genossenschaften von Kunsthandwerkern es ab den 1970ern liebevoll wiederbelebt. Heute ist es das meistfotografierte Fleckchen der Stadt – am schönsten früh am Morgen oder in der Abenddämmerung, wenn die Tagesbusse weg sind und die Fassaden warm beleuchtet werden.\n\n• Den "Escalier Casse-Cou" (Halsbrecher-Treppe) suchen – die älteste Treppe der Stadt verbindet Unter- mit Oberstadt\n• Fresque du Petit-Champlain: das große Wandbild an der Sackgasse am unteren Ende, das die Geschichte des Viertels erzählt\n• Beste Fotomomente frühmorgens vor 9 Uhr oder nach 18 Uhr – tagsüber schiebt sich die Menge durch die enge Gasse\n• Wer die Treppen sparen will: die Standseilbahn (Funiculaire) verbindet Terrasse Dufferin und Unterstadt\n• Nicht nur die Hauptgasse – die Querhöfe und der Boulevard Champlain haben ruhigere Ecken und Blick aufs Wasser'}},
     {about:{t:'Place-Royale',x:'Auf der Place-Royale schlägt das historische Herz Nordamerikas: Hier gründete Samuel de Champlain 1608 seine "Habitation", die Keimzelle der Stadt Québec und der französischen Präsenz auf dem Kontinent. Der intime, von Steinhäusern gerahmte Platz wird beherrscht von der kleinen Kirche Notre-Dame-des-Victoires (1688) – eine der ältesten Steinkirchen des Kontinents. Die Fassaden mit ihren steilen Dächern und Sprossenfenstern sind über Jahrhunderte gewachsen; nach Bränden und Bombardements im 18. Jahrhundert wurde vieles originalgetreu restauriert. Der Ort wirkt wie ein Freilichtmuseum, ist aber lebendig – mit Cafés und im Sommer oft Straßenmusik.\n\n• In die Kirche Notre-Dame-des-Victoires hineinschauen – mit dem Schiffsmodell "Breÿze", das von der Decke hängt\n• An der Nordseite die "Fresque des Québecois": ein riesiges Trompe-l\'œil-Wandbild mit Figuren der Stadtgeschichte\n• In die schmale Rue Notre-Dame und die Nebengassen abbiegen – dort ist es ruhiger als auf dem Platz\n• Das Musée de la Place-Royale erklärt die Gründungsgeschichte, falls es regnet\n• Morgens ist der Platz fast leer – ideal für Fotos ohne Menschenmengen'}},
     {about:{t:'Vieux-Port / Alter Hafen',x:'Nördlich der Place-Royale öffnet sich die Stadt zum Wasser: der Vieux-Port, einst geschäftigster Holz- und Einwandererhafen Nordamerikas, heute eine entspannte Promenade am St.-Lorenz-Strom. Rund um das Bassin Louise liegen Boote, und in der alten Markthalle bietet der Marché du Vieux-Port regionale Erzeuger auf – Ahornprodukte, Cidre, Käse, Beeren der Insel. Die weiten Backstein- und Gusseisenbauten erinnern an die industrielle Blüte des 19. Jahrhunderts. Hier weht die frische Flussluft, es ist luftiger und weniger touristisch verdichtet als in den engen Altstadtgassen.\n\n• Marché du Vieux-Port: guter Ort für regionale Kostproben und Mitbringsel (Öffnungszeiten je nach Saison prüfen)\n• Entlang der Promenade bis zur Pointe-à-Carcy – schöner Blick auf Strom und Silhouette\n• Die Rue Saint-Paul gleich dahinter ist das Antiquitäten- und Galerienviertel – zum Stöbern\n• Von hier legt die Fähre nach Lévis ab: günstigste "Kreuzfahrt" mit dem besten Postkartenblick auf Québec\n• Abends ruhig und stimmungsvoll, tagsüber Ausgangspunkt für Bootstouren'}},

     {about:{t:'Château Frontenac & Terrasse Dufferin',x:'Kein Bauwerk prägt die Silhouette Québecs so wie das Château Frontenac – das märchenhafte Grand Hotel im französischen Schlossstil, 1893 von der Eisenbahngesellschaft Canadian Pacific als Luxushotel eröffnet und angeblich das meistfotografierte Hotel der Welt. Zu seinen Füßen zieht sich die Terrasse Dufferin, eine breite Holzpromenade hoch über dem St.-Lorenz-Strom, mit gusseisernen Pavillons und einem der großartigsten Flussblicke des Kontinents. Hier flanierten schon im 19. Jahrhundert die Bürger; darunter, unter den Holzdielen, liegen die freigelegten Fundamente des alten Forts Saint-Louis. Bei Sonnenuntergang färbt sich der Strom golden und Straßenkünstler treten auf.\n\n• Unter der Terrasse Dufferin liegen archäologische Ausgrabungen von Château Saint-Louis – kostenlos einsehbar\n• Von der Promenade führt die überdachte Standseilbahn hinunter in die Unterstadt\n• Weiter südlich geht die Terrasse in die steile Promenade des Gouverneurs über – hinauf zur Zitadelle, mit den besten Panoramen\n• Bester Fotomoment: goldene Stunde vor Sonnenuntergang, oder vom Kai in Lévis (Fähre) auf die Stadt\n• Im Inneren des Château: Lobby und der "1608 Bar" sind auch ohne Übernachtung zugänglich'}},
     {about:{t:'Zitadelle & Stadtbefestigung',x:'Québec ist die einzige Stadt nördlich von Mexiko, deren Festungsmauern noch vollständig erhalten sind – UNESCO-Welterbe. Auf der Anhöhe des Cap Diamant thront die sternförmige Zitadelle, ab 1820 von den Briten nach Vauban-Vorbild errichtet und bis heute aktive Militärkaserne (Sitz des Royal 22e Régiment, der "Van Doos"). Von hier lässt sich die ganze Wehrgeschichte ablesen: Tore wie die Porte Saint-Louis und Porte Saint-Jean, Bastionen, Kanonen und der Wall, auf dem man ein gutes Stück entlangwandern kann. Die Mauern erzählen von der ständigen Rivalität zwischen Frankreich und Großbritannien um den Schlüssel zum Kontinent.\n\n• Wachablösung (Changing of the Guard) im Sommer meist morgens um 10 Uhr – mit Ziegenmaskottchen des Regiments\n• Zutritt zur Zitadelle nur mit geführter Tour; die Wälle und Tore drumherum sind frei begehbar\n• Auf der Stadtmauer kann man ein langes Stück gehen – schöner, wenig überlaufener Rundblick über Dächer und Strom\n• Direkt daneben das weite Schlachtfeld der Plaines d\'Abraham (1759) – heute Park, ideal für eine Pause\n• Nachmittagslicht schmeichelt der Steinmauer am meisten'}},
     {about:{t:'Gassen der Haute-Ville',x:'Zwischen Château und Stadtmauer liegt das dichte Gassengewirr der Oberstadt – der älteste noch bewohnte Kern der Stadt. Die Rue Saint-Louis und die Rue du Trésor, das schmale Künstlergässchen voller Aquarelle und Radierungen, führen zwischen Steinhäusern mit bunten Dächern hindurch. Hier stehen die Kathedrale Notre-Dame-de-Québec, das alte Priesterseminar und stille Innenhöfe. Es ist der elegante, gewölbte Teil Québecs – Kutschen (Calèches) klappern übers Pflaster, und hinter jeder Ecke öffnet sich ein neuer Blickwinkel auf Kirchturm oder Wall.\n\n• Rue du Trésor: das enge Gang-Freiluftatelier der Stadtkünstler – gut für ein besonderes Mitbringsel\n• In die Kathedrale Notre-Dame-de-Québec schauen – Sitz des ältesten Bistums Nordamerikas\n• Das ruhige Areal des Séminaire de Québec und die Innenhöfe sind leicht zu übersehen\n• Früh dran sein: mittags stauen sich die Menschen auf der Rue Saint-Louis\n• Immer wieder in Sackgassen und Treppchen abbiegen – dort verstecken sich die schönsten Ecken'}},

     {seg:'☀️ Vormittag · Saint-Roch (euer Viertel, ab ~10:00)'},
     {about:{t:'Quartier Saint-Roch',x:'Saint-Roch, unten im Tal der Basse-Ville, ist der spannendste Kontrast zur touristischen Altstadt: das einstige Arbeiter- und Industrieviertel, das nach Jahrzehnten des Verfalls zum kreativen Herzen der Stadt wurde. Rund um die Rue Saint-Joseph reihen sich heute Designbüros, Tech-Firmen, Mikrobrauereien, unabhängige Boutiquen, Plattenläden und einige der besten Restaurants Québecs. Die Backsteinfassaden und der begrünte Jardin Saint-Roch erzählen vom Wandel; die alte Kirche Saint-Roch überragt noch immer das Viertel. Hier isst und trinkt man dort, wo die jungen Québecer wirklich hingehen – ungeschminkt, lebendig, kulinarisch ambitioniert.\n\n• Rue Saint-Joseph Est ist die Hauptachse für Restaurants, Cafés und Shops\n• La Barberie – Genossenschafts-Mikrobrauerei mit Terrasse, Treffpunkt der Nachbarschaft\n• Street Art und Wandbilder in den Seitenstraßen und Durchgängen – Augen offen halten\n• Deutlich weniger touristisch, dafür authentisch – abends wird es in den Bars lebendig\n• Zu Fuß von der Oberstadt über die Passage im Îlot-Fleuri oder über die steile Côte d\'Abraham erreichbar'}},
     {about:{t:'Fêtes de la Nouvelle-France',x:'Anfang August verwandelt sich die Altstadt in ein großes historisches Spektakel: Bei den Fêtes de la Nouvelle-France schlüpft die Stadt zurück ins 17. und 18. Jahrhundert. In Kostümen der französischen Kolonialzeit ziehen Bürger, Soldaten, Händler und Filles du Roy durch die Gassen von Place-Royale und Petit-Champlain; es gibt Umzüge, Musik, Tanz, Handwerksvorführungen, Lagerküche und Szenen aus dem Leben von Neu-Frankreich. Das Fest feiert die Wurzeln der frankophonen Kultur Amerikas dort, wo sie tatsächlich begann – ein dichtes, atmosphärisches Eintauchen in die Gründungsgeschichte der Stadt.\n\n• Herzstück ist die Basse-Ville rund um Place-Royale und Petit-Champlain – dort spielt sich das meiste ab\n• Programm und genaue Daten vorab prüfen; einige Bereiche/Abendveranstaltungen können Eintritt oder ein Kostüm-Bändchen verlangen\n• Wer selbst ein Kostümdetail trägt, ist mittendrin statt nur dabei – viele Einheimische machen mit\n• Abends stimmungsvoll mit Fackeln und Musik, tagsüber familienfreundlich mit Handwerk und Lagerleben\n• Früh kommen für die Umzüge; die engen Gassen sind zu Stoßzeiten sehr voll'}},

    flow:[
     {seg:'🚗 Fahr-Rundtour Île d\'Orléans (ab ~10:00)'},
     {about:{t:'Île d\'Orléans – die Foodie-Insel',x:'Nur 15 Minuten von der Stadt, hinter der Brücke über den St.-Lorenz-Strom, liegt eine andere Welt: die Île d\'Orléans, oft "Wiege Frankreichs in Amerika" genannt, weil viele Québecer ihre Wurzeln auf die hier siedelnden Familien zurückführen. Die rund 34 km lange Insel ist ein einziger fruchtbarer Garten – sechs Dörfer, deren Silhouetten von weißen Kirchtürmen markiert werden, verbunden vom Chemin Royal, der als Ring einmal ganz herumführt. Steinhäuser aus der Kolonialzeit, Obstplantagen, Erdbeerfelder, Weinberge und Höfe reihen sich am Strom. Man fährt langsam, hält oft, kauft direkt ab Hof – das ist der Sinn eines Tages hier.\n\n• Der Chemin Royal führt als Rundkurs um die ganze Insel – im Uhrzeigersinn oder gegen, beides schön\n• In Sainte-Pétronille am Westzipfel: Blick zurück auf die Stadt und die Montmorency-Fälle\n• Erdbeeren und Himbeeren im Sommer direkt vom Feld (Selbstpflücke bei einigen Höfen)\n• Viele Höfe/Läden schließen früh (17–18 Uhr) – Einkäufe nicht auf den späten Nachmittag verschieben\n• Kaum ÖPNV – nur mit Auto oder Rad sinnvoll; für die ganze Runde reichlich Zeit einplanen'}},
     {about:{t:'Cidre, Cassis, Käse & Bäckerei',x:'Die Île d\'Orléans ist berühmt für ihr Terroir, und ein Tag hier ist eine Kette kleiner Verkostungen. Cidreries pressen Apfel- und Eiscidre; die Familie Monna keltert seit Generationen preisgekrönten Cassis-Likör aus schwarzen Johannisbeeren. Auf der Insel wird auch der älteste Käse Nordamerikas hergestellt – der "Paillasson" der Fromages de l\'Isle d\'Orléans, dessen Rezept auf die ersten Siedler zurückgeht und der einst fast verschwunden war. Dazu Ziegenkäse-Softeis, hausgeräucherte Spezialitäten, frisches Brot und Ahornprodukte. Man tastet sich von Hof zu Hof – am besten mit leerem Kofferraum und Appetit.\n\n• Cassis Monna & Filles (721 Chemin Royal, Saint-Pierre): Cassis-Likör, Sorbet und Verkostung – ein Klassiker der Insel\n• Les Fromages de l\'Isle d\'Orléans (2950 Chemin Royal, Sainte-Famille): der historische "Paillasson"-Käse\n• Cidrerie Verger Bilodeau (1225 Chemin Royal): erste Cidrerie der Insel, Apfel- und Eiscidre\n• Vieles ist saison- und wetterabhängig – Öffnungszeiten am selben Tag prüfen, manche Höfe nur Fr–So\n• Nicht alles kaufen wollen: bewusst 3–4 Stopps auswählen, sonst wird der Tag zur Hetze'}},

     {seg:'🛒 Ankunft & Sonntagsmarkt (bis 15 Uhr!)'},
     {about:{t:'Ankunft & Marché public am Ortskern',x:'Baie-Saint-Paul liegt in einem weiten, von Bergen umschlossenen Talkessel dort, wo die Rivière du Gouffre in den Sankt-Lorenz-Strom mündet – eine der ältesten Ortschaften Québecs und seit über hundert Jahren ein Magnet für Maler, die das besondere Licht dieser Bucht suchten. Wer an einem Sonntag ankommt, landet mitten im schönsten Ritual des Ortes: dem Marché public. Von 10 bis 15 Uhr verwandelt sich der Platz am Ortskern in einen summenden Basar aus Charlevoix-Terroir – Käse, Cidre, Wurst, Beeren, Brot, Kunsthandwerk. Es ist weniger Einkauf als geselliger Treffpunkt, an dem Produzenten, Feriengäste und Einheimische denselben Kaffee trinken.\n\n• Der Marché public läuft 2026 vom 14. Juni bis 11. Oktober, jeden Sonntag 10–15 Uhr, direkt am Ortskern (63 rue Ambroise-Fafard) – am 09.08. also in voller Fahrt\n• Bis zu 54 Stände: erst eine Runde ganz durchgehen, dann gezielt zurück zu den besten – die Charlevoix-Cidre- und Käsestände sind oft am schnellsten leer\n• Terrassen und ein Kinderbereich machen ihn zum Verweilmarkt, nicht zum Durchhuschen – Zeit einplanen\n• Parken wird ab spätvormittags eng; früh kommen oder etwas außerhalb parken und die letzten Meter laufen'}},
     {about:{t:'Rue Saint-Jean-Baptiste – das Künstlerviertel',x:'Die Rue Saint-Jean-Baptiste ist das gepflasterte Rückgrat des Städtchens und trägt eine der höchsten Galeriendichten ganz Kanadas. Zwischen bunten Holzfassaden reihen sich Ateliers, Kunstgalerien, Boutiquen und Cafés – hier arbeiteten und arbeiten Künstler, denen Charlevoix seit Generationen als Motiv dient. Man bummelt langsam, tritt in eine Galerie, kommt bei der nächsten Fassade wieder heraus; der ganze Ort ist ein begehbares Bild. Am Nachmittag fällt das Licht flach die Straße hinunter zum Fluss – genau das Licht, das die Maler hergelockt hat.\n\n• Die Galerie d\'art Iris an der Hauptstraße vereint Werke von über achtzig Künstlern – guter erster Anlaufpunkt, um die Bandbreite zu sehen\n• In die kleinen Seitenateliers eintreten – dort trifft man oft die Künstler selbst, abseits der Laufkundschaft\n• Das flache Nachmittags- und Abendlicht über der gepflasterten Straße gibt die besten Fotos\n• Galerien-Öffnungszeiten schwanken saisonal – die Boutiquen schließen teils früh, den Bummel nicht zu spät ansetzen'}},
     {about:{t:'Laiterie Charlevoix – Käserei & Économusée',x:'Etwas außerhalb, an der historischen Route 138, steht die Laiterie Charlevoix, 1948 gegründet und eine der letzten Molkereien Québecs, die ihren Cheddar noch weitgehend handwerklich herstellt. Im angeschlossenen Économusée du fromage sieht man durch Glasscheiben der Käseproduktion zu – Bruch, Salzen, Reifung – und versteht, warum Charlevoix-Käse einen Namen hat. Ein bodenständiger, ehrlicher Kontrast zum Kunstglanz der Innenstadt.\n\n• Adresse: 1167 boulevard Monseigneur-De Laval (Route 138), Baie-Saint-Paul – ein paar Minuten außerhalb des Zentrums\n• Der geführte Rundgang durch das Économusée ist gratis, die Verkostung kostet – der Hofladen lohnt für Cheddar, den frischen Quietsche-Käse (fromage en grains) und Charlevoix-Produkte\n• Frischer fromage en grains am selben Tag ist ein lokaler Kult – am besten noch warm probieren\n• Vor Anfahrt Öffnungszeiten prüfen; am späten Nachmittag ist es ruhiger als mittags'}},

     lead:'Der große Wildlife-Tag: vormittags Walbeobachtungstour ab Tadoussac (unbedingt vorab buchen!), nachmittags Wale vom Ufer, älteste Holzkirche Nordamerikas und Dünen, Sundowner-Bier am Fjord – dann früh/leicht essen und abends fix zur Schwarzbär-Beobachtung nach Sacré-Cœur. Langer Tag mit spätem Rückweg; warm anziehen!'},

     I('Schneller Bissen / Proviant (À L\'Emportée)','food','Take-away vor der Bärentour · ~16:15','À L\'Emportée Tadoussac','v','',{ll:[48.14336,-69.72095],addr:'164 Rue Morin, Tadoussac',time:'16:15',noroute:true,info:{d:'Kleiner Bäckerei-Imbiss für einen schnellen Bissen oder Picknick-Proviant to-go vor der Fahrt zum Bären-Ansitz (Alternativen: La P\'tite Cochonne oder Boutique Chez Mathilde). Da die Tour bis ~20:00 geht und die Rückfahrt lang ist, jetzt etwas essen bzw. für die Fahrt mitnehmen.',t:'Kein Sit-down heute; gegen 17:00 losfahren. Öffnungszeiten vor Ort prüfen.'}}),
     I('🐻 Bärenbeobachtung (Domaine de nos Ancêtres)','nature','✅ GEBUCHT · Start 18:00 · Conf. 00002802 · Ansitz ~2 Std','Domaine de nos Ancetres 1895 Route 172 Sud Sacré-Cœur','c','https://www.ferme5etoiles.com',{must:true,time:'18:00',noroute:true,info:{d:'✅ GEBUCHT & bezahlt (Reservotron-Conf. 00002802 · AML-Res. 239971-5 · 0 CAD, über Kombi gedeckt). 2 Erwachsene, Start 18:00, Dauer ~2 Std. Geführter Schwarzbär-Ansitz: kurze Einführung, dann Walk zum gesicherten Ansitz; Sichtung ~9/10.',t:'📍 Treffpunkt: Domaine de nos Ancêtres, 1895 Route 172 SUD, Sacré-Cœur – spätestens 17:40 da sein (Anbieter nennt teils 30 Min → lieber 17:30). Ab Tadoussac ~17:00 losfahren (~20–30 Min, kein Fährwechsel). Leise & warm anziehen.'}})],
    flow:[
     {seg:'🐋 Anfahrt & Walbeobachtung (ab ~8:30)'},
     {about:{t:'Fjordmündung & Walbeobachtung',x:'Tadoussac sitzt an einer der spektakulärsten Wasserstellen des Kontinents: Hier trifft der tief eingeschnittene Saguenay-Fjord auf den breiten, salzigen Sankt-Lorenz-Strom. Das Aufeinandertreffen von kaltem, nährstoffreichem Wasser macht die Bucht zu einem der besten Orte der Welt für Walbeobachtung – von Belugas über Finn- bis zu Blauwalen im Spätsommer. Von hier startet das Herzstück des Tages: hinaus aufs Wasser, wo Fjordwände und offener Strom die Kulisse für die Tiere bilden.\n\n• Warm und winddicht anziehen – auf dem Wasser ist es empfindlich kühl, selbst an heißen Augusttagen, und Gischt nässt\n• Die tiefstehende Sonne am Morgen und späten Nachmittag gibt das beste Licht; mittags ist der Kontrast hart\n• Fernglas und ein zweiter Akku fürs Handy lohnen sich – die spannendsten Momente kommen unangekündigt\n• Buchungslage und Abfahrtszeit vorab bestätigen; die St-Lorenz-Bootstouren sind im August stark nachgefragt'}},
     {about:{t:'Das Dorf Tadoussac – Kapelle, Düne, Bord-de-l\'Eau',x:'Tadoussac ist einer der ältesten europäischen Handelsplätze Nordamerikas – hier bestand schon um 1600 ein Pelzhandelsposten. Das Dorf selbst ist winzig und maritim: die rot-weiße Silhouette des Hôtel Tadoussac über der Bucht, die kleine hölzerne Kapelle von 1747 (eine der ältesten Holzkirchen des Kontinents) und die berühmten Sanddünen am Ortsrand. Zwischen Bootstouren lässt sich der Ort in einem entspannten Spaziergang aufsaugen, immer mit dem Blick zurück aufs Wasser.\n\n• Die Chapelle de Tadoussac (petite chapelle) ist ein leicht übersehenes Kleinod – von außen unscheinbar, innen historisch\n• Die Dunes de Tadoussac etwas außerhalb geben einen weiten Panoramablick über die Mündung – lohnender Abstecher bei gutem Wetter\n• Entlang der rue du Bord-de-l\'Eau liegen Terrassen mit Fjordblick – bester Platz für einen Zwischenstopp\n• Auch von Land aus zeigen sich manchmal Wale nahe der Küste; Geduld an der Uferpromenade wird belohnt'}},
     {tr:'🚗 Ab Baie-Saint-Paul ~1,5 h nach Baie-Sainte-Catherine, dann die GRATIS-Fähre nach Tadoussac (alle ~20 Min, ~10 Min Überfahrt, keine Reservierung). In Tadoussac ist alles zu Fuß.'},

    flow:[
     {seg:'🚗 Panorama-Rundfahrt Route 362 (ab ~10:00)'},
     {about:{t:'Route 362 – die Route du Fleuve',x:'Die Route 362 zwischen Baie-Saint-Paul und La Malbaie gilt als eine der schönsten Panoramastraßen Nordamerikas. Auf gut 50 Kilometern rollt sie über die Hügelkämme entlang des Sankt-Lorenz-Stroms, taucht in Täler hinab und klettert wieder hinauf – bei jeder Kurve komponiert sich das Bild aus Fluss, Feldern und Bergen neu. Ihre schönsten Kilometer liegen zwischen Les Éboulements und Saint-Irénée, wo der Strom die Windschutzscheibe füllt und die Felder zum Wasser hin abkippen. Ein Genusstag-Auftakt zum langsamen Fahren, nicht zum Durchrasen.\n\n• Immer wieder halten: Die Aussichtspunkte oberhalb Les Éboulements geben die besten Panoramen – der Reiz liegt im Anhalten, nicht im Fahren\n• Saint-Joseph-de-la-Rive (Teil von Les Éboulements) zählt zu den schönsten Dörfern Québecs – der steile Abzweig hinunter zum Fluss lohnt den Umweg\n• Die berüchtigt steile côte in Les Éboulements ist eng und abschüssig – ruhig fahren, im niedrigen Gang\n• Licht und Stimmung wechseln stündlich mit Nebel, Wolken und Schiffsverkehr – morgens und am späten Nachmittag am eindrucksvollsten'}},
     {about:{t:'Zurück in Baie-Saint-Paul – Genuss & Bummel',x:'Am lockeren Genusstag kehrt man ohne Programmzwang nach Baie-Saint-Paul zurück und lässt das Städtchen ein zweites Mal wirken – jetzt ohne Ankunftshektik. Die Rue Saint-Jean-Baptiste zeigt sich am Nachmittag von ihrer entspanntesten Seite: eine Galerie, die man beim ersten Mal übersah, ein Café mit Terrasse, ein letzter Einkauf regionaler Produkte. Der Ort ist klein genug, um ihn zweimal zu genießen, und reich genug, dass es sich lohnt.\n\n• Galerien haben oft wechselnde Öffnungszeiten – wer eine bestimmte wiedersehen will, prüft kurz die Zeiten\n• Am Fluss und an der Uferpromenade (quai) lässt sich der Abend ruhig ausklingen – schöner Blick zurück auf die Berge\n• Regionale Mitbringsel (Charlevoix-Käse, Cidre, Kunsthandwerk) hier authentischer als in touristischen Läden anderswo\n• Der Genusstag hat kein festes Ziel – bewusst Zeit für spontane Stopps lassen'}},
     {tr:'🚗 Panoramaschleife über die Route 362: Baie-Saint-Paul → Les Éboulements → Saint-Irénée → La Malbaie und zurück (~120 km). Optional die Gratis-Fähre ab Saint-Joseph-de-la-Rive auf die Isle-aux-Coudres.'},

    flow:[
     {seg:'🚗 Anfahrt & Altstadt (ab ~14:00)'},
     {about:{t:'Vieux Trois-Rivières & Rue des Ursulines',x:'Zwischen Sankt-Lorenz-Strom und der Fußgängerzone der Rue des Forges liegt der historische Kern von Trois-Rivières — eine der ältesten Städte Nordamerikas, 1634 gegründet. Herzstück ist die Rue des Ursulines: 1650 angelegt, ist sie die älteste Straße der Stadt. Eine Zeile aus Steinhäusern, schmiedeeisernen Balkonen und Kopfstein, über allem die Kuppel des Ursulinen-Klosters. Die Ursulinen kamen 1697 hierher und gründeten die erste Mädchenschule und das erste Spital der Stadt. Für einen Transit-Halt genau richtig: kompakt, zu Fuß in einer guten Stunde zu erschließen, mit dem Fluss immer in Sichtweite.\n\n• Musée des Ursulines, 734 Rue des Ursulines — Kloster, kleines Museum und ein stiller Klostergarten direkt dahinter\n• Bester Fotomoment: die geschlossene Häuserzeile der Rue des Ursulines mit der Klosterkuppel — am schönsten am späten Nachmittag, wenn das Licht von Westen die Fassaden trifft\n• Nur einen Block weiter beginnt die Rue des Forges, die Fußgänger- und Terrassenmeile — hier setzen sich die Einheimischen ins Freie\n• Leise durch die Gassen: die Häuser sind teils bewohnt und denkmalgeschützt — dann entdeckt man die versteckten Innenhöfe und Gedenktafeln'}},
     {about:{t:'Parc portuaire & Uferpromenade am Sankt-Lorenz',x:'Wo der Vieux endet, öffnet sich der Blick: Der Parc portuaire ist die Terrassen-Promenade der Stadt, auf drei Ebenen zum breiten Sankt-Lorenz-Strom hin angelegt. Von hier reicht der Blick über den Hafen bis zur weit gespannten Laviolette-Brücke. Eine monumentale Freitreppe verbindet die Ebenen — in ihre Stufen sind Etappen der Stadtgeschichte eingraviert. Der Park liegt nur wenige Schritte von der Rue des Forges entfernt — die ideale letzte Runde vor der Weiterfahrt nach Ottawa.\n\n• Beste Zeit: früher Vormittag oder Abendlicht — die tiefer stehende Sonne bringt Strom und Brücke zum Leuchten\n• Fotomoment: von der oberen Terrasse mit dem Frachthafen im Vordergrund und der Laviolette-Brücke im Dunst dahinter\n• Optionaler Auto-Abstecher (~6 km ostwärts, Cap-de-la-Madeleine): das Sanctuaire Notre-Dame-du-Cap, zweitgrößter Marienwallfahrtsort Nordamerikas, mit Gärten am Fluss; Eintritt frei\n• Wer nicht gut zu Fuß ist, bleibt auf der oberen Terrasse — der Blick ist dort schon vollständig'}},

     {about:{t:'ByWard Market',x:'Der ByWard Market ist das schlagende Herz der Stadt und einer der ältesten öffentlichen Märkte Kanadas: 1826 ließ ihn Lieutenant-Colonel John By anlegen — derselbe Offizier, der den Rideau-Kanal baute und nach dem die Siedlung zunächst „Bytown“ hieß, bevor sie Ottawa wurde. Über Kopfsteinpflaster reihen sich Marktstände, Blumenhändler und Ahornsirup-Verkäufer, dahinter Backsteinhäuser mit Restaurants, Pubs und Galerien. Tagsüber riecht es nach frischem Obst und gebackenem Teig, abends verwandeln sich die Gassen in Ottawas lebhafteste Ausgehmeile.\n\n• In der George Street steht die allererste BeaverTails-Bude von 1980 — das frittierte, flache Zimt-Zucker-Gebäck ist Ottawas süßes Wahrzeichen.\n• Die schmalen Seitengassen (rund um die William Street) sind voller Wandbilder und bunter Metallschilder — am schönsten und menschenleersten am Vormittag zu fotografieren.\n• Freitag- und Samstagabend wird es laut und voll; wer den Markt ruhig erleben will, kommt vormittags, wenn noch die Frischestände dominieren.\n• Ahornsirup, Ahornbonbons und Icewine gibt es hier direkt am Stand als Mitbringsel — die Frischeware ist meist nur bis zum frühen Nachmittag da.'}},
     {about:{t:'Lower Town / Basse-Ville',x:'Gleich östlich des Marktes beginnt Lower Town (französisch Basse-Ville), das älteste Viertel Ottawas — historisch das Zuhause der französischen und irischen Arbeiterfamilien, die den Kanal und die Sägewerke am Fluss betrieben. Zwischen Steinfassaden entlang der Sussex Drive liegen heute die National Gallery of Canada, die Notre-Dame-Kathedrale und stille Blicke über den Ottawa River hinüber nach Gatineau. Es ist der würdige, museale Gegenpol zum trubeligen Markt nebenan.\n\n• Die riesige Bronze-Spinne „Maman“ von Louise Bourgeois vor der National Gallery ist ein kostenloser Fotospot — man muss dafür kein Museumsticket kaufen.\n• Die Notre-Dame-Basilika ist die älteste Kirche der Stadt (1846); der Eintritt in den blau-goldenen Innenraum ist frei.\n• Hinter der Galerie führt ein Weg zum Nepean Point — der beste kostenlose Aussichtspunkt über den Fluss und die Parlamentskuppeln.\n• Nach Norden über die Sussex Drive reihen sich Botschaften und historische Steinhäuser — schöne, wenig frequentierte Fassaden abseits des Markttrubels.'}},

    flow:[
     {seg:'☀️ Vormittag · Parliament & Downtown (ab ~10:00)'},
     {about:{t:'Parliament Hill',x:'Auf einer Anhöhe über dem Ottawa River thront das Parlament in strengem neugotischem Sandstein — seit 1866 Sitz der Nation, nach dem verheerenden Brand von 1916 neu errichtet. Der Peace Tower ragt als Wahrzeichen über die Stadt, davor brennt die Centennial Flame, und im Sommer marschiert die Wachablösung in Bärenfellmützen über den Rasen. Es ist der zeremonielle Mittelpunkt Kanadas, umgeben von Regierungsbauten und der Fußgängerzone der Sparks Street.\n\n• Die Changing-of-the-Guard-Zeremonie findet im Sommer an vielen Vormittagen auf dem Rasen statt — kostenlos, aber früh kommen für einen Platz vorne.\n• Das Centre Block ist wegen einer jahrelangen Großsanierung geschlossen; Parlamentsführungen laufen über das West Block und das Besucherzentrum — Zeitfenster vorab online sichern.\n• Hinter dem Gebäude verläuft ein Uferweg mit weitem Blick über den Fluss nach Gatineau — der ruhigste Teil des Hügels.\n• Die Centennial Flame am Haupteingang trägt die Wappen aller Provinzen und Territorien im Beckenrand — ein beliebter, oft übersehener Detail-Fotopunkt.'}},
     {about:{t:'Hintonburg',x:'Westlich der Innenstadt entlang der Wellington West liegt Hintonburg — einst ein rußiges Arbeiter- und Handwerkerviertel, heute Ottawas kreatives Zentrum mit Galerien, Ateliers, Craft-Brauereien, Röstereien und eigenwilligen Läden. Die Backsteinbauten der Industriezeit stehen noch, doch dahinter haben sich Designer, Köche und Künstler eingerichtet. „Wellington West“ ist die Straße, in der die Einheimischen einkaufen, essen und ausgehen, wenn sie dem Markttrubel entkommen wollen.\n\n• Der Parkdale Market ist ein kleiner, echter Bauernmarkt, wo Locals einkaufen — deutlich weniger touristisch als der ByWard Market.\n• Suzy Q Doughnuts (1015 Wellington St. W.) ist eine lokale Kult-Adresse für handgemachte Donuts — früh hin, die beliebten Sorten sind mittags oft ausverkauft.\n• Hintonburg gilt als Ottawas Straßenkunst-Viertel; rund um die Unterführungen und Seitengassen finden sich großflächige Murals.\n• Zwischen Parkdale und Holland Avenue verstecken sich Antik-, Vintage- und Designläden, die man vom Bürgersteig leicht übersieht.\n• Die Tap-Rooms der lokalen Brauereien (etwa Tooth and Nail) sind am Wochenende voll — unter der Woche entspannter.'}},

    flow:[
     {seg:'🌲 Vormittag · Gatineau Park (ab ~9:30)'},
     {about:{t:'Gatineau Park',x:'Nur wenige Minuten über den Fluss, schon in Québec, beginnt der 361 km² große Gatineau Park — kein Nationalpark, sondern von der National Capital Commission verwaltete Wildnis auf den bewaldeten Hügeln des Kanadischen Schilds. Seen, Steilkanten und Ahornwälder ersetzen abrupt die Stadt; im Sommer lockt kühles Badewasser, im Herbst das flammende Laub. Es ist Ottawas grüne Fluchtburg, in der schon Premierminister Mackenzie King seinen Landsitz baute.\n\n• Der Pink Lake ist ein türkisgrüner, meromiktischer See (seine Wasserschichten mischen sich nie) — ein Rundweg von rund 2,5 km führt herum; Baden ist zum Schutz verboten, die Holzstege sind die besten Fotopunkte.\n• Vom Champlain Lookout öffnet sich der weite Blick über das Ottawa-Tal von der Eardley-Steilkante — am Morgen ist die Fernsicht am klarsten.\n• Das Mackenzie King Estate zeigt den Landsitz des früheren Premiers mit bewusst angelegten „Ruinen“ und einer Teestube.\n• Die Badeseen Meech Lake und Lac Philippe sind im Hochsommer beliebt — die Parkplätze sind am Wochenende früh voll, am besten vor 10 Uhr kommen.\n• An den Hauptpunkten erhebt die NCC eine Parkgebühr — Karte oder Bargeld bereithalten.'}},
     {about:{t:'Old Chelsea',x:'Am Südtor des Parks liegt das kleine Dorf Old Chelsea — ein künstlerisch angehauchter Weiler mit Cafés, kleinen Läden und dem historischen Chelsea Pub in einem Haus von 1875. Nach einem Tag in der Natur ist es der entspannte, französischsprachige Ausklang: Outaouais-Lebensart, wo man auf einer Terrasse sitzt, statt in den Stadtverkehr zurückzukehren.\n\n• Old Chelsea Square bündelt Läden, eine Eisdiele und Cafés — ein gemütlicher Abschluss eines Wandertags, ruhiger als die Innenstadt.\n• Der Chelsea Pub sitzt in einem der ältesten Gebäude des Ortes (1875) mit Terrasse direkt an der Straße.\n• Wer weiterfahren mag: das Dorf Wakefield mit seiner gedeckten Holzbrücke (covered bridge) liegt rund 20 Minuten nördlich am Fluss.\n• Hier gilt Québec, nicht Ontario — Französisch dominiert, und die Laden- und Alkoholregeln unterscheiden sich vom anderen Flussufer.'}},
