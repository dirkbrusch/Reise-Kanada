    flow:[
     {seg:'🌅 Ankunftsabend · Wellington & Umgebung (ab ~16:45)'},
     {about:{t:'Weinland um Wellington & Hillier',x:'Prince Edward County ist Ontarios jüngste, eigenwilligste Weinregion – eine flache Halbinsel im Lake Ontario, die noch vor zwanzig Jahren vor allem für Apfelplantagen, Milchbauern und stille Buchten bekannt war. Dann entdeckten Winzer den kalkhaltigen Kalksteinboden, der stark an das Burgund erinnert, und pflanzten Pinot Noir und Chardonnay in ein kühles Klima, das schlanke, mineralische Weine hervorbringt. Heute reihen sich über vierzig Weingüter durch die Landschaft, viele in liebevoll restaurierten Scheunen und Post-and-Beam-Barns aus dem 19. Jahrhundert. Rund um Wellington und den Weiler Hillier liegt das dichteste Cluster – hier fährt man von einem Verkostungsraum zum nächsten über schmale Landstraßen, vorbei an Reben, Sonnenblumenfeldern und Hofläden. Der Ort Wellington selbst ist das hippe Herz der Region: eine einzige lange Main Street mit Cafés, Galerien, Boutique-Hotels und einem Yachthafen am See, wo an einem lauen Augustabend die ersten Gäste mit einem Glas County-Wein auf der Terrasse sitzen.\n\n• Für den Ankunftsabend keine große Winery-Tour mehr planen – viele Verkostungsräume schließen zwischen 17 und 18 Uhr; ein bis zwei nahe Wellington reichen, den Rest für die kommenden Tage aufheben.\n• Karlo Estates (561 Danforth Road) ist wegen der stimmungsvollen 1805er-Scheune und der veganen Weine ein Fotomotiv – vorab Öffnungszeiten prüfen, im Sommer oft Reservierung für Sitzverkostungen nötig.\n• Wer Sonnenuntergang am Wasser will, parkt an Wellingtons Main Street und geht die paar Schritte zum Wellington Rotary Beach / Yachthafen – Einheimische treffen sich hier für den Blick über den See.\n• Sonntagabend ist ruhiger als Samstag, aber im August trotzdem gut besucht: Für das Abendessen in Wellington unbedingt vorab reservieren, sonst weicht man nach Picton aus.\n• Der Farmers Market und viele Hofläden haben nur tagsüber offen – Käse, Obst und Cider fürs Zimmer besser vor 16 Uhr besorgen.'}},
     {about:{t:'Sandbanks Provincial Park',x:'Sandbanks ist der Grund, warum viele überhaupt ins County kommen – und der Kontrast zur Weinlandschaft könnte kaum größer sein. Am Südrand der Halbinsel liegt die größte Süßwasser-Sanddünen-Barriere der Welt: kilometerlange, hell schimmernde Dünen, die sich zwischen Lake Ontario und einer flachen Lagune auftürmen, dahinter türkis-klares, erstaunlich seichtes Wasser, das sich im Hochsommer fast wie ein Mittelmeerstrand anfühlt. Drei Strände teilen sich den Park: Outlet Beach, der längste und beliebteste, ideal zum Schwimmen und für Familien; Dunes Beach, wilder und ruhiger, mit den spektakulären Wanderdünen direkt im Rücken; und der kleinere Lakeshore Beach an der Lagunenseite. An einem Augustabend, wenn die Tagesausflügler abreisen, legt sich goldenes Licht über die Dünen – einer der schönsten Sonnenuntergangsplätze Ontarios. Wichtig: Es gibt keine Rettungsschwimmer, und Hunde sind außerhalb des ausgewiesenen Bereichs nicht erlaubt.\n\n• Im Sommer ist ein Vehicle Permit für die Tageseinfahrt oft schon mittags ausverkauft – über das Ontario-Parks-Reservierungssystem vorab online buchen, sonst wird man am Tor abgewiesen.\n• Zum Sonnenuntergang ist Dunes Beach der Geheimtipp: weniger Andrang als Outlet, und das Licht auf den Dünen ist am fotogensten – festes Schuhwerk fürs Erklimmen mitnehmen.\n• Keine Rettungsschwimmer: Das Wasser ist flach und meist harmlos, bei auflandigem Wind aber Vorsicht mit Kindern.\n• Am späten Nachmittag/Abend leeren sich die Parkplätze – wer die Tageshitze und den Andrang meiden will, kommt bewusst spät und bleibt bis zum Abendlicht.\n• Mückenschutz einpacken: In der Dämmerung wird es an den Feuchtgebieten hinter den Dünen spürbar.'}},
     {tr:'Im County ist alles ländlich – kurze Fahrten mit dem Auto zwischen Dorf, Höfen und Restaurants (überall kostenlose Parkplätze).'},

     {about:{t:'Die Niagarafälle',x:'Die Niagarafälle sind kein Geheimtipp, aber ihre Wucht überrascht trotzdem jeden: Rund 2.400 Kubikmeter Wasser stürzen pro Sekunde über die Kante der Horseshoe Falls, und der Sprühnebel steigt so hoch, dass man ihn kilometerweit sieht. Die kanadische Seite gilt als die schönere — von der Promenade am Table Rock blickt man frontal in den Hufeisenfall hinein. Der Ort Niagara Falls selbst ist dagegen laut und grell, gesäumt von Casinos und Wachsfigurenkabinetten. Die Natur liefert das Spektakel, der Rummel drumherum ist Geschmackssache.\n\n• Bester Fotomoment: früher Vormittag, bevor die Reisebusse eintreffen und wenn die Ostsonne den Nebel in Regenbögen taucht\n• Die Bootstour (Anleger unterhalb der Fälle, kanadische Seite) fährt direkt in die Gischt — Regenponcho gibt es dazu, aber das Handy wasserdicht verstauen\n• "Journey Behind the Falls": ein Tunnel führt hinter die Wassermassen, weniger nass und ganzjährig geöffnet\n• Die Neon-Attraktionen am Clifton Hill kann man ohne Kinder getrost überspringen — kostet nur Zeit\n• Parken ist an den Fällen teuer; die WeGo-Busse oder das Parkhaus an Table Rock sind die praktischste Lösung'}},
     {about:{t:'Niagara-on-the-Lake & Weinregion',x:'Nur 20 Autominuten nördlich liegt Niagara-on-the-Lake, und der Kontrast könnte kaum größer sein: gepflegte viktorianische Häuser, Blumenampeln an jeder Laterne, ein Kolonialflair, das den Ort zu einer der besterhaltenen Kleinstädte des 19. Jahrhunderts in Nordamerika macht. Einst war NOTL die erste Hauptstadt Oberkanadas. Heute ist die Queen Street eine Bühne aus Boutiquen, Fudge-Läden und dem renommierten Shaw Festival. Ringsum breitet sich die Weinregion am Ontariosee aus — bekannt vor allem für ihren Eiswein und feine Rieslinge.\n\n• Klassische Weingüter für einen Nachmittag: Peller Estates, Trius und Inniskillin (der Eiswein-Pionier) — Verkostung meist ohne Voranmeldung, am Wochenende aber voll\n• Wer fährt, bestimmt vorher den "Designated Driver": die Verkostungen sind großzügig, Kanadas Promillegrenzen streng\n• Unbedingt Eiswein probieren, auch wenn er süß ist — das ist die Spezialität, für die die Region weltberühmt wurde\n• Auf der Queen Street: die hausgemachten Marmeladen bei Greaves und das Fudge in der Old Fashioned Sweet Shoppe, beides seit Generationen\n• Der kleine Hafen am Ende der Front Street mit Blick über den See zum US-Ufer wird von Tagesgästen fast immer übersehen'}},

     {about:{t:'St. Lawrence Market & Old Town',x:'Der St. Lawrence Market ist Torontos kulinarisches Herz seit 1803 und wurde von National Geographic einst zum besten Lebensmittelmarkt der Welt gekürt. Unter dem Ziegeldach der South Market drängen sich über hundert Händler: Käse, Meeresfrüchte, Gewürze — und die Institution schlechthin, das Peameal-Bacon-Sandwich. Drumherum liegt Old Town, der älteste Teil der Stadt, wo schmale Gassen und Backsteinlager an das Toronto des 19. Jahrhunderts erinnern, überragt von der Turmspitze der St. James Cathedral.\n\n• Das Peameal-Bacon-Sandwich bei der Carousel Bakery im Obergeschoss ist der Klassiker — früh dran sein, mittags bilden sich Schlangen\n• Hinunter ins Untergeschoss zu Kozlik\'s Senf und den Käseständen — dort kaufen die Einheimischen, nicht oben\n• Timing: dienstags bis samstags ist der South Market am lebendigsten; sonntags Antikmarkt im North Market, montags ruhiger\n• Die flatiron-artige Gooderham Building an der Ecke Church/Front Street ist das beste Fotomotiv der Altstadt\n• Buster\'s Sea Cove im Markt für frisches, günstiges Fish and Chips — leicht zu übersehen'}},
     {about:{t:'Distillery District',x:'Der Distillery District ist das schönste Industriedenkmal der Stadt: über 40 viktorianische Backsteingebäude der einstigen Gooderham-&-Worts-Whiskybrennerei, zu ihrer Zeit die größte der Welt, heute eine autofreie Fußgängerzone aus Galerien, Ateliers, Cafés und Restaurants. Das Kopfsteinpflaster, die schmiedeeisernen Details und die Lichterketten über den Gassen machen es zum meistfotografierten Viertel Torontos — im Winter mit dem Weihnachtsmarkt, im Sommer voller Leben.\n\n• Der Zutritt ist frei — nur einzelne Ausstellungen und Verkostungen kosten Eintritt\n• Die überdimensionale "Love"-Skulptur ist das bekannteste Fotomotiv des Viertels\n• Bei den Ateliers vorbeischauen: hier arbeiten echte Glasbläser und Künstler vor Ort, nicht nur Souvenirläden\n• SOMA Chocolate für handgemachte Pralinen und eine dichte, fast puddingartige Trinkschokolade\n• Am schönsten am späten Nachmittag und frühen Abend, wenn die Lichter angehen und das Licht weich wird'}},

     {about:{t:'Downtown & CN Tower',x:'Der CN Tower war von 1975 bis 2007 das höchste freistehende Bauwerk der Welt und ist bis heute Torontos Wahrzeichen: 553 Meter, sichtbar von fast überall. Der Glasboden in 342 Metern Höhe lässt Schwindelfreie senkrecht auf die Straße hinunterblicken, das drehbare Restaurant an der Spitze serviert kanadische Küche mit dem besten Ausblick der Stadt. Zu Füßen des Turms liegt das dichte Downtown mit den Wolkenkratzern des Finanzviertels und dem Rogers Centre gleich nebenan.\n\n• Tickets vorab online kaufen spart die Warteschlange; nur an klaren Tagen lohnt sich der Aufstieg, bei Dunst sieht man wenig\n• Der "EdgeWalk" — gesichertes Gehen außen um die Turmspitze — ist das Adrenalin-Extra für Mutige\n• Bester Turmblick fürs Foto von unten: vom Roundhouse Park südlich des Turms\n• Ripley\'s Aquarium direkt am Fuß des Turms ist die beste Schlechtwetter-Alternative, aber immer gut besucht\n• Der Sonnenuntergang oben ist magisch, aber am teuersten und schnell ausgebucht — rechtzeitig planen'}},
     {about:{t:'Harbourfront & Waterfront',x:'Wo einst Lagerhäuser und Bahngleise den See versperrten, zieht sich heute die Waterfront als breite Promenade am Ontariosee entlang. Das Harbourfront Centre ist ihr kulturelles Zentrum: Kunstausstellungen, Bootsanleger, Straßenkünstler und im Sommer ein ständiger Reigen von Festivals. Von den Piers legen die Fähren zu den Toronto Islands ab — der grüne Gegenentwurf zur Skyline, von dem aus man die berühmteste Ansicht der Stadt bekommt.\n\n• Die Fähre zu den Toronto Islands lohnt sich allein für den Skyline-Blick — Tickets online, an heißen Wochenenden lange Schlangen\n• Entlang der Queens Quay flanieren: Straßenmusiker, Eisstände und der Blick auf die Segelboote\n• Der Sugar Beach mit seinen pinken Sonnenschirmen (östlich) ist ein skurriler, oft übersehener Fotospot\n• Fahrradverleih an der Promenade — die Uferwege sind flach und autofrei\n• Am Wasser ist es oft deutlich kühler und windiger als im Zentrum; eine Jacke einpacken'}},

     {seg:'☀️ Vormittag · Kensington & Chinatown (ab ~10:30)'},
     {about:{t:'Kensington Market',x:'Kensington Market ist Torontos anarchisches Herz — ein Viertel, das sich jeder Gentrifizierung widersetzt. In den schmalen viktorianischen Häusern, einst von jüdischen, dann portugiesischen, karibischen und lateinamerikanischen Einwanderern bewohnt, drängen sich Vintage-Läden, Käsehändler, Empanada-Buden und Cafés hinter bunt bemalten Fassaden. Es riecht nach Räucherstäbchen und frischem Brot, überall Streetart, und an autofreien Sonntagen wird die Straße zur Bühne. Ein nationales historisches Viertel Kanadas — und dabei völlig ungeschminkt.\n\n• Bester Bummel: kreuz und quer durch Kensington Avenue, Augusta Avenue und Baldwin Street — planlos ist hier Programm\n• Die Wandbilder in den Seitengassen sind die besten Fotomotive; das Graffiti wechselt ständig\n• Bei den alten Nuss- und Kaffeeröstern wie Casa Acoreana vorbeischauen — Relikte des ursprünglichen Marktes\n• Vintage-Kleidung bei Courage My Love an der Kensington Avenue, eine Institution seit Jahrzehnten\n• Am "Pedestrian Sunday" (letzter Sonntag im Monat im Sommer) ist das Viertel autofrei und am lebendigsten'}},
     {about:{t:'West Queen West',x:'Die Queen Street West westlich der Bathurst ist das kreative Schaufenster Torontos — vom Vogue-Magazin einst zu einem der angesagtesten Viertel der Welt erklärt. Zwischen dem Trinity Bellwoods Park und dem Gladstone House reihen sich unabhängige Galerien, Designerläden, Plattenläden und Cafés. Hier wohnt die Kunst- und Musikszene, die Fassaden sind Leinwände, und die parallele Ossington Avenue hat sich zur dichtesten Restaurant- und Barmeile der Stadt entwickelt.\n\n• Der Trinity Bellwoods Park ist am Wochenende der Treffpunkt der Stadt — Picknick, Frisbee, Leute beobachten\n• Die "Graffiti Alley" (Rush Lane, parallel südlich der Queen) ist Torontos berühmteste Streetart-Gasse — Pflichtstopp für Fotos\n• Das Drake und das Gladstone sind Kunst-Hotels — schon ein Drink in der Lobby lohnt den Abstecher\n• Die Ossington Avenue abends für Bars und Restaurants — enger, jünger und lebendiger als die Queen selbst\n• Unabhängige Platten- und Buchläden statt Ketten — hier shoppen die Locals'}},

function moveInDay(dayKey,pos,dir){
  const day=findDay(dayKey);if(!day)return;
  const o=dayOrder(dayKey,day.items.length).slice();
  const np=pos+dir;if(np<0||np>=o.length)return;
  [o[pos],o[np]]=[o[np],o[pos]];setDayOrder(dayKey,o);renderPlan();syncPlanChecks();updateProgress();
}
function findDay(dayKey){ // dayKey = si+'-'+di  oder  si+'-d'
  const parts=dayKey.split('-');const si=+parts[0];
  if(parts[1]==='d')return {items:STAGES[si].items,base:si+'-d'};
  const di=+parts[1];return {items:STAGES[si].days[di].items,base:si+'-'+di};

function stageIds(s,si){
  return s.drive ? s.items.map((_,ii)=>si+'-d-'+ii)
    : s.days.flatMap((d,di)=>d.items.map((_,ii)=>si+'-'+di+'-'+ii));
}
function allItems(){ // [it, id, si, dayObj|null]
  const out=[];
  STAGES.forEach((s,si)=>{
    if(s.drive)s.items.forEach((it,ii)=>out.push([it,si+'-d-'+ii,si,null]));
    else s.days.forEach((d,di)=>d.items.forEach((it,ii)=>out.push([it,si+'-'+di+'-'+ii,si,d])));
  });

}

// Fuß-Distanz aus Koordinaten (Luftlinie × Straßenfaktor ~1,3)
function haversineM(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLon=toR(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function walkMeters(a,b){ return haversineM(a,b)*1.3; }
function kmStr(m){ return m<950 ? (Math.round(m/50)*50)+' m' : (Math.round(m/100)/10).toString().replace('.',',')+' km'; }

  if(order.length){ url+='&destination='+enc(order[order.length-1]); const mids=order.slice(0,-1); if(mids.length) url+='&waypoints='+mids.map(enc).join('%7C'); }
  else url+='&destination='+enc(from);
  const wx = r.wx?`<div class="wxbar"><span class="wxi">${esc(r.wxi||'🌦️')}</span><div>${esc(r.wx)}</div></div>`:'';
  const dist = totM>250 ? `<span class="daydist">🚶 ~${(Math.round(totM/100)/10).toString().replace('.',',')} km</span>` : '';

    <div class="rt-head">🗺️ <b>Tagesablauf</b>${r.mode?`<span class="rt-mode">${esc(r.mode)}</span>`:''}${dist}</div>

}

let filterGrp='all', filterQ='';
function renderPlan(){
  const list=document.getElementById('planList');
  const grp=GROUPS.find(g=>g.id===filterGrp);
  const q=filterQ.trim().toLowerCase();
  if(filterGrp==='all' && !q){
    let h='';
    STAGES.forEach((s,si)=>{
      const ids=stageIds(s,si);
      const done=ids.filter(id=>get(id).done).length;
      const collapsed = si>0 ? 'collapsed':'';
      h+=`<div class="stage ${collapsed}" data-si="${si}" id="stage-${si}">
        <div class="head"><span class="badge">${s.badge}</span>
          <div style="flex:1;min-width:0"><h2>${esc(s.name)}</h2><span class="sub">${esc(s.sub)}</span></div>

          <span class="chev">▾</span></div>
        <div class="body">`;
      if(s.hotel) h+=`<div class="hotel">🏨 ${esc(s.hotel)}</div>`;
      h+=bookingHtml(s);h+=transitHtml(s);h+=parkingHtml(s);h+=shoppingHtml(s);h+=extrasHtml(s);h+=modesHtml(s.name);
      if(s.drive){
        if(s.flow){ h+=dayFlowHtml(s,s,si,'d'); }
        else {
          const dk=si+'-d',ord=dayOrder(dk,s.items.length);
          const names=ord.map(ii=>s.items[ii].map), gpx=ord.map(ii=>({nm:s.items[ii].nm,q:s.items[ii].map}));
          h+=`<div class="day" data-dropday="${dk}"><div class="drive">🚗 Scenic-Etappe</div>`;
          h+=tourBtns('Fahrt '+s.name,names,gpx,'Fahrt-Route (Google Maps)');
          ord.forEach((ii,pos)=>h+=itemHtml(s.items[ii],si+'-d-'+ii,{dayKey:dk,pos,len:ord.length}));
          h+=tourExtraHtml(s.name);
          h+=`</div>`;
        }
      } else {
        s.days.forEach((d,di)=>{
          const dk=si+'-'+di,ord=dayOrder(dk,d.items.length);
          h+=`<div class="day" data-dropday="${dk}"><h3><span class="dt">${esc(d.dt)}</span> ${esc(d.title)}</h3>`;
          if(d.flow){ h+=dayFlowHtml(d,s,si,di); }
          else { h+=routeHtml(d,s); h+=dayTours(d,dk,ord,si,di); h+=tourExtraHtml(d.title); }
          h+=`</div>`;
        });
      }
      h+=`</div></div>`;
    });
    list.innerHTML=h;
  } else {
    // gefilterte Flachliste
    let rows=allItems().filter(([it])=>{
      const inGrp = filterGrp==='all' || (grp.cats||[]).includes(it.cat);
      const inQ = !q || (it.nm+' '+it.nt).toLowerCase().includes(q);
      return inGrp && inQ;
    });
    if(!rows.length){list.innerHTML='<div class="empty">Nichts gefunden.</div>';return;}
    let h='',lastSi=-1;
    rows.forEach(([it,id,si])=>{
      if(si!==lastSi){
        if(lastSi>=0)h+='</div></div></div>';
        h+=`<div class="stage"><div class="head" style="cursor:default"><span class="badge">${STAGES[si].badge}</span><div style="flex:1"><h2>${esc(STAGES[si].name)}</h2></div></div><div class="body"><div class="day">`;
        lastSi=si;
      }
      h+=itemHtml(it,id);
    });
    h+='</div></div></div>';
    list.innerHTML=h;
  }
}

const STAGECOL=['#a01e1e','#9a8478','#1a73e8','#9a8478','#2f6b4f','#7c5cbf','#0f7b8a','#9a8478','#c8932a','#9a8478','#37476b'];
function dayByIso(iso){
  for(let si=0;si<STAGES.length;si++){const s=STAGES[si];
    if(s.drive){ if(s.iso===iso) return {si,type:'drive',s}; }
    else { for(let di=0;di<s.days.length;di++){ if(s.days[di].iso===iso) return {si,di,type:'day',s,d:s.days[di]}; } }
  }
  return null;
}

function pad2(n){return String(n).padStart(2,'0');}

      } else {
        h+=`<div class="calcell ${iso===today?'today':''}"><div class="dn" style="color:var(--muted)">${dn}</div></div>`;
      }

    h+=`</div>`;

function allBlocksByIso(iso){
  const out=[];

    if(s.drive){if(s.iso===iso)out.push({si,type:'drive',s});}
    else s.days.forEach((d,di)=>{if(d.iso===iso)out.push({si,di,type:'day',s,d});});
  });
  return out;
}

      h+=`<div class="story-drive">🚗 <b>${esc(nm)}</b> <span class="sd-sub">${esc(s.sub)}</span>${intro?`<p>${esc(intro)}</p>`:''}</div>`;
      txt+=`\n🚗 ${nm} — ${s.sub}\n`+(intro?intro+'\n':'');
    } else {
      h+=`<section class="story-stage"><h2><span class="ss-badge">${s.badge}</span> ${esc(s.name)} <span class="ss-dates">${esc(s.sub)}</span></h2>`;
      txt+=`\n— ${s.name} (${s.sub}) —\n`;
      s.days.forEach(d=>{
        const intro=storyIntro(d.title), dn=dayNumFor(d.iso);
        h+=`<div class="story-day"><div class="sd-head"><span class="sd-tag">Tag ${dn}</span> <span class="sd-date">${esc(d.dt)}</span> <b>${esc(d.title)}</b></div>${intro?`<p>${esc(intro)}</p>`:''}</div>`;
        txt+=`\nTag ${dn} · ${d.dt} — ${d.title}\n`+(intro?intro+'\n':'');
      });
      h+=`</section>`;
    }
  });
  h+=`<p class="story-foot">Erstellt mit unserer Reise-App · Ostkanada 2026 🍁</p></div>`;
  el.innerHTML=h;
  _storyText=txt;
}

// ================= FAVORITEN =================
function renderFavs(){
  let h='';let n=0;
  STAGES.forEach((s,si)=>{
    const list = s.drive ? s.items.map((it,ii)=>[it,si+'-d-'+ii]) :
      s.days.flatMap((d,di)=>d.items.map((it,ii)=>[it,si+'-'+di+'-'+ii]));
    const favs=list.filter(([it,id])=>get(id).fav);
    if(favs.length){
      h+=`<div class="stage"><div class="head" style="cursor:default"><span class="badge">${s.badge}</span><div style="flex:1"><h2>${esc(s.name)}</h2></div></div><div class="body"><div class="day">`;
      favs.forEach(([it,id])=>{h+=itemHtml(it,id);n++;});
      h+=`</div></div></div>`;
    }
  });
  document.getElementById('favs').innerHTML = n? h : '<div class="empty">Noch keine Favoriten.<br>Tippe bei einem Spot auf den ☆-Stern.</div>';
}

// ================= LISTEN =================
function clBlock(title,arr,prefix,emoji){
  const chk=state._check||{};
  let done=0;
  let rows=arr.map((p,i)=>{
    const id=prefix+'-'+i; if(chk[id])done++;
    return `<div class="clitem ${chk[id]?'done':''}">
      <input type="checkbox" class="cb clcb" data-cl="${id}" ${chk[id]?'checked':''}>
      <div class="nm">${esc(p[0])}${p[1]?`<span class="why">${esc(p[1])}</span>`:''}</div></div>`;
  }).join('');
  const customs=(state._custom||[]).filter(c=>c.list===prefix);
  customs.forEach((c,i)=>{
    const id=prefix+'-x-'+i; if(chk[id])done++;
    rows+=`<div class="clitem ${chk[id]?'done':''}">
      <input type="checkbox" class="cb clcb" data-cl="${id}" ${chk[id]?'checked':''}>
      <div class="nm">${esc(c.nm)}</div>
      <button class="x bentry-x" data-delc="${prefix}|${i}" style="border:0;background:none;color:#c25555;cursor:pointer">✕</button></div>`;
  });
  const total=arr.length+customs.length;
  return `<div class="card"><h2>${emoji} ${title} <span class="sub" style="font-weight:400">· ${done}/${total}</span></h2>${rows}
    <div class="addrow"><input type="text" placeholder="Eigenen Punkt hinzufügen…" data-addinp="${prefix}">
    <button class="btn sec" data-add="${prefix}">+</button></div></div>`;
}
function renderLists(){
  document.getElementById('lists').innerHTML =
    clBlock('Reisevorbereitung',PREP,'prep','🎫') + clBlock('Packliste',PACK,'pack','🧳');
}

// ================= BUDGET =================
function renderBudget(){
  const b=state._budget||[]; const rate=state._rate||0.67;
  const totCad=b.reduce((s,e)=>s+(e.cur==='CAD'?e.amt:e.amt/rate),0);
  const totEur=b.reduce((s,e)=>s+(e.cur==='EUR'?e.amt:e.amt*rate),0);
  const byCat={};b.forEach(e=>{const eur=e.cur==='EUR'?e.amt:e.amt*rate;byCat[e.cat]=(byCat[e.cat]||0)+eur;});
  const maxCat=Math.max(1,...Object.values(byCat));
  let h=`<div class="card"><h2>💰 Ausgabe erfassen</h2>
    <div class="brow">
      <input type="text" id="bdesc" class="bfull" placeholder="Was? (z. B. Abendessen L'Express)">
      <input type="number" id="bamt" inputmode="decimal" step="0.01" placeholder="Betrag">
      <select id="bcur"><option>CAD</option><option>EUR</option></select>
      <select id="bcat" class="bfull">${BCATS.map(c=>`<option>${c}</option>`).join('')}</select>
    </div>
    <button class="btn" id="badd">Hinzufügen</button>
    <div class="rate">Kurs: 1 CAD = <input type="number" id="brate" step="0.01" value="${rate}"> EUR</div>
  </div>`;
  h+=`<div class="card"><h2>📊 Übersicht</h2>
    <div class="btotal">
      <div class="box"><div class="v">${totEur.toFixed(0)} €</div><div class="l">Gesamt EUR</div></div>
      <div class="box"><div class="v">${totCad.toFixed(0)} $</div><div class="l">Gesamt CAD</div></div>
      <div class="box"><div class="v">${b.length}</div><div class="l">Einträge</div></div>
    </div>`;
  BCATS.forEach(c=>{
    if(!byCat[c])return;
    h+=`<div class="bcat"><div class="lbl"><span>${c}</span><b>${byCat[c].toFixed(0)} €</b></div>
      <div class="bar"><i style="width:${(byCat[c]/maxCat*100).toFixed(0)}%"></i></div></div>`;
  });
  h+='</div>';
  if(b.length){
    h+='<div class="card"><h2>🧾 Einträge</h2>';
    [...b].reverse().forEach(e=>{
      h+=`<div class="bentry"><span class="d">${e.d}</span><span class="n">${esc(e.nm)}<br><span style="font-size:11px;color:var(--muted)">${e.cat}</span></span>
        <span class="a">${e.amt.toFixed(2)} ${e.cur}</span><button class="x" data-bdel="${e.id}">✕</button></div>`;
    });
    h+='</div>';
  }
  document.getElementById('budget').innerHTML=h;
}

// ================= PROGRESS =================
function updateProgress(){
  let total=0,done=0;
  STAGES.forEach((s,si)=>{stageIds(s,si).forEach(id=>{total++;if(get(id).done)done++;});});
  const pct= total? Math.round(done/total*100):0;
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('ptxt').textContent=`${done} von ${total} Spots erledigt · ${pct}%`;
  // Etappen-Zähler aktualisieren
  document.querySelectorAll('[data-cnt]').forEach(el=>{
    const si=+el.dataset.cnt;const ids=stageIds(STAGES[si],si);
    el.textContent=ids.filter(id=>get(id).done).length+'/'+ids.length;
  });
}
function updateCountdown(){
  const t=isoToday();const el=document.getElementById('countdown');
  if(t<TRIP_START){const days=Math.ceil((new Date(TRIP_START)-new Date(t))/86400000);
    el.textContent=`✈️ Noch ${days} Tage bis zur Abreise`;}
  else if(t>TRIP_END){el.textContent='🛬 Reise abgeschlossen';}
  else{const n=Math.round((new Date(t)-new Date(TRIP_START))/86400000)+1;
    el.textContent=`🍁 Reisetag ${n} von ${TRIP_DAYS}`;}
}

// ================= INTERAKTION =================
document.addEventListener('click',e=>{
  // Etappe auf/zu
  const head=e.target.closest('.stage > .head');
  if(head && head.parentElement.dataset.si!==undefined && document.getElementById('planList').contains(head)){
    head.parentElement.classList.toggle('collapsed');return;}
  // Stern
  if(e.target.classList.contains('star')){
    const it=e.target.closest('.item');const id=it.dataset.id;const nv=!get(id).fav;
    setv(id,'fav',nv);e.target.classList.toggle('on',nv);e.target.textContent=nv?'★':'☆';return;}
  // Notiz
  if(e.target.classList.contains('noteBtn')){
    const ta=e.target.closest('.item').querySelector('.note');ta.classList.toggle('show');if(ta.classList.contains('show'))ta.focus();return;}
  // Hintergrund-Info auf-/zuklappen (Klick auf Namen oder „ℹ️ Hintergrund")
  if(e.target.classList.contains('infoBtn') || e.target.closest('.nm.hasinfo')){
    const it=e.target.closest('.item');if(it&&it.querySelector('.infopanel'))it.classList.toggle('openinfo');return;}
  // Schlechtwetter-/Entspannen-Button auf-/zuklappen
  if(e.target.classList.contains('modebtn')){
    e.target.closest('.mode').classList.toggle('open');return;}
  // Sortier-Pfeile
  if(e.target.classList.contains('ordup')||e.target.classList.contains('orddn')){
    moveInDay(e.target.dataset.daykey,+e.target.dataset.pos,e.target.classList.contains('ordup')?-1:1);return;}
  // Kalendertag → Tagesplan
  const cc=e.target.closest('.calcell.trip');
  if(cc){_calSel=cc.dataset.calday;renderCal();const dt=document.getElementById('caldetail');if(dt)dt.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  // GPX-Download (Komoot)
  if(e.target.classList.contains('gpx')){
    try{
      const stops=JSON.parse(e.target.dataset.gpx);const nm=e.target.dataset.gpxname||'Tour';
      const g=buildGpx(nm,stops);
      if(!g){alert('Für diese Tour liegen noch keine GPS-Koordinaten vor – nutze den Google-Maps-Routenlink (der funktioniert immer).');return;}
      const blob=new Blob([g],{type:'application/gpx+xml'});const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download=nm.replace(/[^\w]+/g,'_')+'.gpx';a.click();
    }catch(_){}
    return;}
  // PDF / Druck
  if(e.target.id==='pdfBtn'){doPrint();return;}
  // Reisebericht kopieren
  if(e.target.id==='storyCopyBtn'){
    const done=()=>{e.target.textContent='✓ Kopiert!';setTimeout(()=>{e.target.textContent='📋 Als Text kopieren';},1800);};
    try{navigator.clipboard.writeText(_storyText).then(done,()=>done());}
    catch(_){alert('Kopieren nicht möglich – bitte den Text manuell markieren.');}
    return;}
  // Chips
  if(e.target.classList.contains('chip')){filterGrp=e.target.dataset.grp;renderChips();renderPlan();updateProgress();return;}
  // Karte → Etappe
  const mn=e.target.closest('.mnode');
  if(mn && mn.dataset.si!==''){
    switchTab('plan');
    const st=document.getElementById('stage-'+mn.dataset.si);
    if(st){st.classList.remove('collapsed');st.scrollIntoView({behavior:'smooth',block:'start'});}
    return;}
  // Heute → Listen
  if(e.target.dataset.goto){switchTab(e.target.dataset.goto);return;}
  // Checklisten: eigener Punkt
  if(e.target.dataset.add!==undefined && e.target.dataset.add){
    const pre=e.target.dataset.add;
    const inp=document.querySelector(`[data-addinp="${pre}"]`);
    if(inp.value.trim()){state._custom=(state._custom||[]);state._custom.push({list:pre,nm:inp.value.trim()});save();renderLists();}
    return;}
  if(e.target.dataset.delc){
    const [pre,i]=e.target.dataset.delc.split('|');
    const customs=(state._custom||[]).filter(c=>c.list===pre);
    const all=state._custom||[];const target=customs[+i];
    state._custom=all.filter(c=>c!==target);save();renderLists();return;}
  // Budget
  if(e.target.id==='badd'){
    const nm=document.getElementById('bdesc').value.trim();
    const amt=parseFloat(document.getElementById('bamt').value);
    if(!nm||!amt||amt<=0)return;
    const cur=document.getElementById('bcur').value, cat=document.getElementById('bcat').value;
    const d=new Date();const ds=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';
    state._budget=(state._budget||[]);state._budget.push({id:Date.now(),d:ds,nm,amt,cur,cat});
    save();renderBudget();return;}
  if(e.target.dataset.bdel){
    state._budget=(state._budget||[]).filter(x=>String(x.id)!==e.target.dataset.bdel);save();renderBudget();return;}
  // Backup
  if(e.target.id==='expBtn'){
    const j=JSON.stringify(state);document.getElementById('ioArea').value=j;
    try{navigator.clipboard.writeText(j);}catch(_){}
    const blob=new Blob([j],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='kanada2026-backup.json';a.click();return;}
  if(e.target.id==='impBtn'){
    try{const j=JSON.parse(document.getElementById('ioArea').value);state=j;save();
      renderAll();alert('Import erfolgreich!');}
    catch(_){alert('Ungültiges JSON – bitte kompletten Export einfügen.');}return;}
  if(e.target.id==='resetBtn'){
    if(confirm('Wirklich ALLES löschen (Häkchen, Favoriten, Notizen, Budget, Listen)?')){state={};save();renderAll();}return;}
  if(e.target.id==='themeBtn'){
    const cur=document.body.dataset.theme==='dark'?'light':'dark';
    document.body.dataset.theme=cur;state._theme=cur;save();
    e.target.textContent=cur==='dark'?'☀️':'🌙';return;}
});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('clcb')){
    state._check=Object.assign({},state._check,{[e.target.dataset.cl]:e.target.checked});save();
    e.target.closest('.clitem').classList.toggle('done',e.target.checked);
    renderLists();return;}
  if(e.target.classList.contains('cb')&&e.target.closest('.item')){
    const it=e.target.closest('.item');const id=it.dataset.id;setv(id,'done',e.target.checked);
    it.classList.toggle('done',e.target.checked);}
  if(e.target.id==='brate'){state._rate=parseFloat(e.target.value)||0.67;save();renderBudget();}
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('note')){const id=e.target.closest('.item').dataset.id;setv(id,'note',e.target.value);}
  if(e.target.id==='q'){filterQ=e.target.value;renderPlan();updateProgress();}
});
// Drag & Drop (Desktop)
let _drag=null;
document.addEventListener('dragstart',e=>{
  const it=e.target.closest('.item[draggable="true"]');if(!it)return;
  _drag={dayKey:it.dataset.daykey,pos:+it.dataset.pos};it.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',it.dataset.pos);}catch(_){}
});
document.addEventListener('dragover',e=>{
  const it=e.target.closest('.item[draggable="true"]');
  if(!it||!_drag||it.dataset.daykey!==_drag.dayKey)return;
  e.preventDefault();
  document.querySelectorAll('.item.dragover').forEach(x=>x.classList.remove('dragover'));
  it.classList.add('dragover');
});
document.addEventListener('drop',e=>{
  const it=e.target.closest('.item[draggable="true"]');
  if(!it||!_drag||it.dataset.daykey!==_drag.dayKey)return;
  e.preventDefault();
  const from=_drag.pos,to=+it.dataset.pos;
  if(from!==to){
    const day=findDay(_drag.dayKey);
    const o=dayOrder(_drag.dayKey,day.items.length).slice();
    const [m]=o.splice(from,1);o.splice(to,0,m);
    setDayOrder(_drag.dayKey,o);renderPlan();syncPlanChecks();updateProgress();
  }
  _drag=null;
});
document.addEventListener('dragend',()=>{
  document.querySelectorAll('.dragging,.dragover').forEach(x=>x.classList.remove('dragging','dragover'));_drag=null;
});
function syncPlanChecks(){
  document.querySelectorAll('#planList .item').forEach(el=>{
    const st=get(el.dataset.id);
    el.classList.toggle('done',!!st.done);
    const cb=el.querySelector('.cb');if(cb)cb.checked=!!st.done;
    const star=el.querySelector('.star');if(star){star.classList.toggle('on',!!st.fav);star.textContent=st.fav?'★':'☆';}
  });
}
function switchTab(t){
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('show',p.id===t));
  if(t==='favs')renderFavs();
  if(t==='today')renderToday();
  if(t==='budget')renderBudget();
  if(t==='lists')renderLists();
  if(t==='cal')renderCal();
  if(t==='story')renderStory();
  if(t==='stays')renderStays();
  if(t==='map')renderMap();
  if(t==='plan'){syncPlanChecks();updateProgress();}
  window.scrollTo({top:0});
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

// ================= INIT =================
function renderAll(){
  renderChips();renderPlan();renderEvents();renderToday();renderLists();renderBudget();renderInfo();updateProgress();updateCountdown();
  // Karte & Kalender werden beim Öffnen des jeweiligen Tabs gerendert (Leaflet braucht sichtbaren Container)
  const act=document.querySelector('nav.tabs button.active');
  if(act&&act.dataset.tab==='map')renderMap();
  if(act&&act.dataset.tab==='cal')renderCal();
}
if(state._theme==='dark'||(!state._theme&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
  document.body.dataset.theme='dark';document.getElementById('themeBtn').textContent='☀️';
}
renderAll();
</script>
